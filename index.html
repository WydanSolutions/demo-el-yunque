/* =====================================================================
   STOCK
   - Stock actual: lo que hay físicamente en el local.
   - Reservado: vendido y pagado pero todavía no entregado (envíos y acopios).
   - Disponible = actual − reservado.
   - Productos con vencimiento: por LOTE; al sacar, primero el que vence antes.
   ===================================================================== */
function stockDe(p){ return p.vence ? r2(p.lotes.reduce((s, l) => s + l.c, 0)) : p.stock; }
function reservados(){
  return memo('reservados', () => {
    const r = {};
    D().ventas.forEach(v => { if (v.est === 'anulada') return; v.it.forEach(i => { const pend = r2(i.c - i.e); if (pend > 0) r[i.p] = r2((r[i.p] || 0) + pend); }); });
    return r;
  });
}
const reservadoDe = pid => reservados()[pid] || 0;
const disponibleDe = p => r2(stockDe(p) - reservadoDe(p.id));
function lotesOrdenados(p){ return p.lotes.slice().sort((a, b) => (a.vence || '9999').localeCompare(b.vence || '9999')); }

function movStock(pid, c, motivo, ref, lote){
  D().mstock.unshift({ id:Store.id('ms'), f:hoy(), h:hora(), p:pid, c:r2(c), m:motivo, ref:ref || '', u:usuarioTxt(), lote:lote || '' });
}
function sacarStock(pid, cantidad, motivo, ref){
  const p = producto(pid); cantidad = r2(cantidad);
  if (!p || cantidad <= 0) return;
  if (!p.vence){ p.stock = r2(p.stock - cantidad); movStock(pid, -cantidad, motivo, ref); return; }
  let resta = cantidad; const usados = [];
  lotesOrdenados(p).forEach(l => {
    if (resta <= 0 || l.c <= 0) return;
    const q = Math.min(l.c, resta); l.c = r2(l.c - q); resta = r2(resta - q); usados.push(l.lote);
  });
  if (resta > 0){   // se vendió más de lo que había: queda en negativo "sin lote" hasta que entre mercadería
    let sl = p.lotes.find(l => l.lote === 'S/L');
    if (!sl){ sl = { id:Store.id('l'), lote:'S/L', c:0, vence:null }; p.lotes.push(sl); }
    sl.c = r2(sl.c - resta); usados.push('S/L');
  }
  p.lotes = p.lotes.filter(l => l.c !== 0);
  movStock(pid, -cantidad, motivo, ref, usados.join(', '));
}
function entrarStock(pid, cantidad, motivo, ref, lote, vence){
  const p = producto(pid); cantidad = r2(cantidad);
  if (!p || cantidad <= 0) return;
  if (!p.vence){ p.stock = r2(p.stock + cantidad); movStock(pid, cantidad, motivo, ref); return; }
  let q = cantidad;
  const neg = p.lotes.find(l => l.c < 0);
  if (neg){ const cub = Math.min(-neg.c, q); neg.c = r2(neg.c + cub); q = r2(q - cub); }
  if (q > 0){
    if (!lote){   // devolución o corrección sin lote: vuelve al lote que vence antes
      const prim = lotesOrdenados(p).find(l => l.c > 0);
      if (prim){ prim.c = r2(prim.c + q); lote = prim.lote; }
      else p.lotes.push({ id:Store.id('l'), lote:(lote = 'S/L'), c:q, vence:null });
    } else {
      const ex = p.lotes.find(l => l.lote === lote && (l.vence || '') === (vence || ''));
      if (ex) ex.c = r2(ex.c + q); else p.lotes.push({ id:Store.id('l'), lote, c:q, vence:vence || null });
    }
  }
  p.lotes = p.lotes.filter(l => l.c !== 0);
  movStock(pid, cantidad, motivo, ref, lote);
}

/* ---------- Estado de cada producto ---------- */
const ESTADOS_PROD = {
  normal:  { t:'Normal',           c:'c-verde' },
  bajo:    { t:'Bajo mínimo',      c:'c-amarillo' },
  falta:   { t:'En falta',         c:'c-rojo' },
  sinmov:  { t:'Sin movimiento',   c:'c-gris' },
  proximo: { t:'Próximo a vencer', c:'c-amarillo' },
  vencido: { t:'Vencido',          c:'c-rojo' }
};
function indiceVentas(){
  return memo('iv', () => {
    const m = {}, mes = mesClave(hoy());
    D().ventas.forEach(v => {
      if (v.est === 'anulada') return;
      const f = factorDesc(v);
      v.it.forEach(i => {
        const x = m[i.p] || (m[i.p] = { ult:null, cantMes:0, montoMes:0 });
        if (!x.ult || v.f > x.ult) x.ult = v.f;
        if (mesClave(v.f) === mes){ x.cantMes = r2(x.cantMes + i.c - i.d); x.montoMes += (i.c - i.d) * i.pr * f; }
      });
    });
    return m;
  });
}
function info(p){
  return memo('inf_' + p.id, () => {
    const h = hoy(), cfg = D().config;
    const st = stockDe(p), res = reservadoDe(p.id), disp = r2(st - res);
    const iv = indiceVentas()[p.id] || {};
    let vencidos = 0, prox30 = 0, prox60 = 0, proxVence = null;
    if (p.vence) p.lotes.forEach(l => {
      if (l.c <= 0 || !l.vence) return;
      const d = difDias(h, l.vence);
      if (d < 0) vencidos = r2(vencidos + l.c);
      else { if (d <= 30) prox30 = r2(prox30 + l.c); else if (d <= cfg.diasVence) prox60 = r2(prox60 + l.c);
             if (!proxVence || l.vence < proxVence) proxVence = l.vence; }
    });
    const ult = iv.ult || null;
    const diasSin = difDias(ult || p.alta, h);
    const estados = [];
    if (disp <= 0) estados.push('falta'); else if (disp <= p.min) estados.push('bajo');
    if (vencidos > 0) estados.push('vencido');
    if (prox30 + prox60 > 0) estados.push('proximo');
    if (st > 0 && diasSin >= cfg.diasSinVentas) estados.push('sinmov');
    return { st, res, disp, vencidos, prox30, prox60, proxVence, ult, diasSin, estados, estado: estados[0] || 'normal',
             vendMes: iv.cantMes || 0, montoMes: iv.montoMes || 0 };
  });
}
function chipEstadoProd(e){ const x = ESTADOS_PROD[e]; return `<span class="chip ${x.c}">${x.t}</span>`; }
function chipsProd(p){ const i = info(p); return i.estados.length ? i.estados.map(chipEstadoProd).join(' ') : chipEstadoProd('normal'); }
function valorStock(){
  return memo('valor', () => {
    let costo = 0, venta = 0;
    D().productos.forEach(p => { const s = Math.max(0, stockDe(p)); costo += s * p.costo; venta += s * p.precio; });
    return { costo, venta };
  });
}
function inmovilizado(){   // plata parada en productos sin ventas en X días (a costo)
  return memo('inmov', () => {
    const lista = D().productos.filter(p => info(p).estados.includes('sinmov'));
    return { lista, monto: lista.reduce((s, p) => s + Math.max(0, stockDe(p)) * p.costo, 0) };
  });
}

/* =====================================================================
   VENTAS
   Cada renglón: { p: producto, n: nombre, c: cantidad, pr: precio, co: costo,
                   e: cantidad ya entregada, d: cantidad devuelta }
   ===================================================================== */
function factorDesc(v){ return v.sub > 0 ? (v.sub - v.desc) / v.sub : 1; }
function montoDevuelto(v){ return (v.devs || []).reduce((s, d) => s + d.monto, 0); }
function netoVenta(v){ return v.est === 'anulada' ? 0 : v.tot - montoDevuelto(v); }
function costoVenta(v){ return v.est === 'anulada' ? 0 : v.it.reduce((s, i) => s + (i.c - i.d) * i.co, 0); }
const ventaActiva = v => v.est !== 'anulada';
const pendienteFactura = v => ventaActiva(v) && !v.fac;
function pendienteEntrega(v){ return ventaActiva(v) && v.it.some(i => i.c - i.e > 0); }
function chipsVenta(v){
  if (v.est === 'anulada') return '<span class="chip c-gris">Anulada</span>';
  let s = v.fac ? `<span class="chip c-verde">${esc(v.fac.t)} ${esc(v.fac.n)}</span>` : '<span class="chip chip-fac">Pendiente de factura</span>';
  if ((v.devs || []).length) s += ' <span class="chip c-naranja">Con devolución</span>';
  if (v.aco) s += ' <span class="chip c-azul sin-punto">Acopio</span>';
  return s;
}
function vendedorTxt(v){ return v.vend === 'func' ? 'Funcionario' : 'Dueños'; }
function nuevoNumero(tipo){ D().nums[tipo] = (D().nums[tipo] || 0) + 1; return D().nums[tipo]; }

/* ---------- Cuentas corrientes de clientes ---------- */
// Los pagos se aplican a las ventas a cuenta más viejas. Una venta está "cobrada" cuando quedó cubierta.
function ccIndice(){
  return memo('cc', () => {
    const r = { porCli:{}, cobradas:new Set() };
    D().clientes.forEach(c => r.porCli[c.id] = { deuda:0, pagado:0, saldo:0, ventas:[] });
    D().ventas.forEach(v => { if (v.pago === 'Cuenta corriente' && ventaActiva(v) && r.porCli[v.cli]){ r.porCli[v.cli].deuda += netoVenta(v); r.porCli[v.cli].ventas.push(v); } });
    D().cobros.forEach(c => { if (r.porCli[c.cli]) r.porCli[c.cli].pagado += c.monto; });
    Object.keys(r.porCli).forEach(id => {
      const x = r.porCli[id]; x.saldo = x.deuda - x.pagado;
      let queda = x.pagado;
      x.ventas.sort((a, b) => (a.f + a.h).localeCompare(b.f + b.h)).forEach(v => { const n = netoVenta(v); if (queda >= n - .5){ r.cobradas.add(v.id); queda -= n; } else queda = -1e12; });
    });
    return r;
  });
}
const saldoCliente = id => (ccIndice().porCli[id] || { saldo:0 }).saldo;
const ventaCobrada = v => v.pago !== 'Cuenta corriente' || ccIndice().cobradas.has(v.id);
function ultimaCompraCli(id){ return memo('ucli', () => { const m = {}; D().ventas.forEach(v => { if (v.cli && ventaActiva(v) && (!m[v.cli] || v.f > m[v.cli])) m[v.cli] = v.f; }); return m; })[id] || null; }

/* ---------- Proveedores y cuentas a pagar ---------- */
function cpIndice(){
  return memo('cp', () => {
    const r = {};
    D().proveedores.forEach(p => r[p.id] = { comprado:0, pagado:0, saldo:0, pendientes:[] });
    D().compras.forEach(c => { if (r[c.prov]) r[c.prov].comprado += c.tot; });
    D().dinero.forEach(m => { if (m.tipo === 'pagoProv' && r[m.prov]) r[m.prov].pagado += m.monto; });
    Object.keys(r).forEach(id => {
      const x = r[id]; x.saldo = x.comprado - x.pagado;
      let queda = x.pagado;
      D().compras.filter(c => c.prov === id).sort((a, b) => a.f.localeCompare(b.f)).forEach(c => {
        if (queda >= c.tot - .5){ queda -= c.tot; return; }
        x.pendientes.push({ compra:c, debe:c.tot - Math.max(0, queda) }); queda = 0;
      });
    });
    return r;
  });
}
const saldoProv = id => (cpIndice()[id] || { saldo:0 }).saldo;
function estadoPedido(pd){
  const rec = pd.it.reduce((s, i) => s + i.r, 0);
  if (rec <= 0) return 'pendiente';
  return pd.it.every(i => i.r >= i.c) ? 'recibido' : 'parcial';
}
const ESTADOS_PEDIDO = { pendiente:{ t:'Pendiente', c:'c-amarillo' }, parcial:{ t:'Recibido parcial', c:'c-azul' }, recibido:{ t:'Recibido', c:'c-verde' } };
const ESTADOS_ENTREGA = { pendiente:{ t:'Pendiente', c:'c-amarillo' }, camino:{ t:'En camino', c:'c-azul' }, entregada:{ t:'Entregada', c:'c-verde' } };

/* ---------- Comisiones del funcionario ---------- */
function tasaComision(cat){ const c = D().config; return c.comisionCat[cat] != null && c.comisionCat[cat] !== '' ? Number(c.comisionCat[cat]) : Number(c.comisionGeneral); }
function comisionVenta(v){
  if (v.vend !== 'func' || !ventaActiva(v)) return { base:0, com:0 };
  const f = factorDesc(v); let base = 0, com = 0;
  v.it.forEach(i => { const p = producto(i.p), b = (i.c - i.d) * i.pr * f; base += b; com += b * tasaComision(p ? p.cat : '') / 100; });
  return { base, com };
}
function ventasLiquidadas(){ return memo('liq', () => { const s = new Set(); D().liquidaciones.forEach(l => l.ventas.forEach(id => s.add(id))); return s; }); }
// Ventas del funcionario efectivamente cobradas y todavía no liquidadas (menos devoluciones).
function comisionAPagar(desde, hasta){
  const liq = ventasLiquidadas();
  const ventas = D().ventas.filter(v => v.vend === 'func' && ventaActiva(v) && v.f >= desde && v.f <= hasta && !liq.has(v.id));
  const cobradas = ventas.filter(ventaCobrada), sinCobrar = ventas.filter(v => !ventaCobrada(v));
  const ajustes = D().comAjustes.filter(a => !a.liq);
  let base = 0, com = 0;
  cobradas.forEach(v => { const c = comisionVenta(v); base += c.base; com += c.com; });
  const aj = ajustes.reduce((s, a) => s + a.monto, 0);
  return { cobradas, sinCobrar, ajustes, base, com, aj, total: com + aj };
}

/* =====================================================================
   DINERO: gastos, retiros, aportes, pagos a proveedores, cobros y caja
   ===================================================================== */
function nuevoDinero(o){
  const m = Object.assign({ id:Store.id('d'), f:hoy(), h:hora(), medio:'Efectivo', u:usuarioTxt() }, o);
  m.monto = Number(m.monto) || 0; D().dinero.unshift(m); return m;
}
function cajaDelDia(f){
  const c = D().caja[f] || null, ef = x => x === 'Efectivo';
  const ing = [], egr = [];
  const suma = (lista, t, arr, fn) => { const n = lista.reduce((s, x) => s + fn(x), 0); if (lista.length) arr.push({ t, n:lista.length, monto:n }); };
  const vEf = D().ventas.filter(v => v.f === f && ef(v.pago));
  suma(vEf, 'Ventas en efectivo', ing, v => v.tot);
  suma(D().cobros.filter(x => x.f === f && ef(x.medio)), 'Cobros de cuentas corrientes', ing, x => x.monto);
  suma(D().dinero.filter(m => m.f === f && m.tipo === 'aporte' && ef(m.medio)), 'Aportes de capital', ing, m => m.monto);
  const devs = []; D().ventas.forEach(v => { if (ef(v.pago)) (v.devs || []).forEach(d => { if (d.f === f) devs.push(d); }); });
  suma(devs, 'Devoluciones', egr, d => d.monto);
  suma(D().ventas.filter(v => v.anul && v.anul.f === f && ef(v.pago)), 'Ventas anuladas', egr, v => v.tot - montoDevuelto(v));
  ['gasto', 'retiro', 'pagoProv'].forEach(t => suma(D().dinero.filter(m => m.f === f && m.tipo === t && ef(m.medio)), { gasto:'Gastos', retiro:'Retiros de socios', pagoProv:'Pagos a proveedores' }[t], egr, m => m.monto));
  const totIng = ing.reduce((s, x) => s + x.monto, 0), totEg = egr.reduce((s, x) => s + x.monto, 0);
  const ap = c ? c.ap : 0;
  const otros = {}; D().ventas.filter(v => v.f === f && !ef(v.pago)).forEach(v => otros[v.pago] = (otros[v.pago] || 0) + v.tot);
  return { f, abierta: !!c, ap, ing, egr, totIng, totEg, esperado: ap + totIng - totEg, cierre: c && c.cierre, otros };
}
function resultadoMes(mes){   // mes = 'AAAA-MM'
  const ventas = D().ventas.filter(v => ventaActiva(v) && mesClave(v.f) === mes);
  const vendido = ventas.reduce((s, v) => s + netoVenta(v), 0);
  const cmv = ventas.reduce((s, v) => s + costoVenta(v), 0);
  const gastosL = D().dinero.filter(m => m.tipo === 'gasto' && mesClave(m.f) === mes);
  const gastos = gastosL.reduce((s, m) => s + m.monto, 0);
  const porCat = {}; gastosL.forEach(m => porCat[m.cat] = (porCat[m.cat] || 0) + m.monto);
  const ganancia = vendido - cmv - gastos;
  return { mes, n:ventas.length, vendido, cmv, gastos, porCat, ganancia, margen: vendido ? ganancia / vendido * 100 : 0 };
}

function ventasConEntrega(){ return D().ventas.filter(v => v.ent && ventaActiva(v)); }
function entregasPendientesHoy(){ const h = hoy(); return ventasConEntrega().filter(v => v.ent.est !== 'entregada' && v.ent.f <= h); }

    if (v){ v.cli = c.id; v.ent = { dir:c.dir, zona:c.zona, f:h, flete:d.config.fleteBase, nota:'', est:'pendiente' }; v.fl = d.config.fleteBase; v.tot += v.fl; v.it.forEach(i => i.e = 0); conEntHoy = [v]; }
  }
  if (conEntHoy[0]) conEntHoy[0].ent.est = 'camino';
  const ayer = d.ventas.filter(v => v.f === sumarDias(h, -1) && v.cli);
  if (ayer.length){
    const v = ayer[0], c = d.clientes.find(x => x.id === v.cli), pc = P('C001');
    v.it.push(hacerItem(pc, 8)); v.sub += 8 * pc.precio; v.tot += 8 * pc.precio + d.config.fleteBase; v.fl = d.config.fleteBase;
    v.ent = { dir:c.dir, zona:c.zona, f:sumarDias(h, -1), flete:d.config.fleteBase, nota:'Llamar antes de ir', est:'pendiente' };
    v.it.forEach(i => i.e = 0);
  }
  // Una venta grande a cuenta de la herrería (queda por encima de su límite de crédito)
  (() => {
    const f = sumarDias(h, -19), v = armarVenta(f, '10:20', [hacerItem(P('H001'), 2), hacerItem(P('H002'), 2), hacerItem(P('F010'), 40), hacerItem(P('F011'), 6)],
      { cli:'cl4', pago:'Cuenta corriente', vend:'func' });
    return v;
  })();
  // Acopios: el cliente paga todo y va retirando de a poco
  const acopio = (dd, cl, lista, retiros) => {
    const f = sumarDias(h, dd), items = lista.map(([cod, c]) => { const it = hacerItem(P(cod), c); it.e = 0; return it; });
    const v = armarVenta(f, '09:40', items, { cli:cl, pago:'Transferencia', vend:'duenos', aco:true });
    retiros.forEach(([rdd, cant]) => {
      const rf = sumarDias(h, rdd), it = cant.map(([cod, c]) => ({ p:P(cod).id, c }));
      it.forEach(x => { const i = v.it.find(y => y.p === x.p); i.e += x.c; mov(rf, '10:00', x.p, -x.c, 'retiro', 'Acopio venta Nº ?', 'Dueños'); });
      v.ret.push({ f:rf, it, u:'Dueños' });
    });
    return v;
  };
  acopio(-41, 'cl3', [['C001', 20], ['C005', 1500], ['C003', 4]], [[-38, [['C001', 8], ['C005', 600], ['C003', 2]]], [-16, [['C001', 4], ['C005', 400]]]]);
  acopio(-26, 'cl1', [['C007', 40], ['C009', 10], ['C006', 300]], [[-24, [['C007', 25], ['C009', 6], ['C006', 200]]]]);
  acopio(-12, 'cl7', [['P001', 3], ['P007', 2]], [[-10, [['P001', 1], ['P007', 2]]]]);

  // Orden cronológico y numeración
  d.ventas.sort((a, b) => (a.f + a.h).localeCompare(b.f + b.h));
  d.ventas.forEach(v => { v.num = ++d.nums.venta; });
  d.mstock.forEach(m => { if (m.ref === 'Acopio venta Nº ?'){ const v = d.ventas.find(x => x.aco && x.it.some(i => i.p === m.p) && x.ret.some(r => r.f === m.f)); m.ref = v ? 'Retiro de acopio · venta Nº ' + v.num : 'Retiro de acopio'; } });
  _cache = {};

  // Devoluciones y anulaciones de ejemplo
  const pasadas = d.ventas.filter(v => v.f < sumarDias(h, -6) && !v.aco && v.it.some(i => i.c >= 2) && (!v.ent || v.ent.est === 'entregada'));
  [7, 41, 88, 150, 230, 310].forEach(k => {
    const v = pasadas[pasadas.length - 1 - k]; if (!v) return;
    const i = v.it.find(x => x.c >= 2); const q = 1;
    i.d = q; const monto = Math.round(q * i.pr * factorDesc(v)), f = sumarDias(v.f, 2);
    v.devs.push({ f, it:[{ p:i.p, c:q }], monto, m:elegir(['No era la medida', 'Le sobró', 'Falla de fábrica']), u:'Dueños' });
    mov(f, '11:15', i.p, q, 'devolucion', 'Devolución · venta Nº ' + v.num, 'Dueños');
  });
  [20, 95, 170].forEach(k => {
    const v = pasadas[pasadas.length - 1 - k]; if (!v || v.devs.length) return;
    v.est = 'anulada'; v.anul = { f:v.f, m:elegir(['Error en la carga', 'El cliente se arrepintió']), u:'Dueños' };
  });
  // Movimientos de stock de las ventas (últimos 4 meses)
  d.ventas.forEach(v => {
    const u = v.vend === 'duenos' ? 'Dueños' : 'Diego (funcionario)';
    if (v.aco) return;
    const entregada = !v.ent || v.ent.est === 'entregada';
    v.it.forEach(i => {
      if (!v.ent) mov(v.f, v.h, i.p, -i.c, 'venta', 'Venta Nº ' + v.num, u);
      else if (entregada) mov(v.ent.f, '15:30', i.p, -i.c, 'entrega', 'Entrega · venta Nº ' + v.num, u);
    });
    if (v.est === 'anulada') v.it.forEach(i => mov(v.anul.f, '18:40', i.p, i.c, 'anulacion', 'Anulación · venta Nº ' + v.num, 'Dueños'));
  });

  /* ---- Compras, pagos y pedidos ---- */
  let nFac = 3100;
  d.proveedores.forEach((pv, k) => {
    const prods = d.productos.filter(p => p.prov === pv.id);
    for (let dd = -176 + k * 2; dd <= -4; dd += 13 + (k % 3) * 2){
      const f = sumarDias(h, dd), elegidos = prods.filter(() => rnd() < .55).slice(0, 6);
      if (!elegidos.length) continue;
      const it = elegidos.map(p => {
        const c = r2(Math.max(pasoDe(p), Math.round(p.min * (.8 + rnd() * .8) / pasoDe(p)) * pasoDe(p)));
        const co = Math.round(p.costo * (dd < -60 ? .94 : 1));
        return { p:p.id, c, co, lote: p.vence ? 'L-' + R(1000, 9999) : '', vence: p.vence ? sumarDias(f, 300) : '' };
      });
      const tot = it.reduce((s, i) => s + i.c * i.co, 0);
      const cond = pv.plazo ? 'credito' : 'contado';
      const cp = { id:ID('cp'), prov:pv.id, fac:'A ' + (++nFac), f, it, tot, cond, venc: cond === 'credito' ? sumarDias(f, pv.plazo) : '', pedido:null, u:'Dueños' };
      d.compras.push(cp);
      it.forEach(i => mov(f, '09:30', i.p, i.c, 'compra', 'Compra · ' + pv.nombre + ' · ' + cp.fac, 'Dueños', i.lote));
      // Se paga al vencimiento (las más nuevas quedan pendientes: cuentas a pagar)
      if (cond === 'contado') d.dinero.push({ id:ID('d'), f, h:'09:35', tipo:'pagoProv', prov:pv.id, compra:cp.id, cat:'', monto:tot, medio:'Efectivo', nota:'Compra al contado ' + cp.fac, u:'Dueños' });
      else if (cp.venc < sumarDias(h, -1) && !(pv.id === 'pv3' && cp.venc >= sumarDias(h, -9)))
        d.dinero.push({ id:ID('d'), f:cp.venc, h:'11:00', tipo:'pagoProv', prov:pv.id, compra:cp.id, cat:'', monto:tot, medio:'Transferencia', nota:'Pago factura ' + cp.fac, u:'Dueños' });
    }
  });
  // Pedidos: dos pendientes, uno recibido en parte y algunos ya recibidos
  const pedido = (dd, prov, lista, nota) => { const pd = { id:ID('pd'), num:++d.nums.pedido, prov, f:sumarDias(h, dd), it:lista.map(([cod, c, r]) => ({ p:P(cod).id, c, r:r || 0 })), nota:nota || '', u:'Dueños' }; d.pedidos.push(pd); return pd; };
  d.compras.filter(c => c.f > sumarDias(h, -45)).slice(-4).forEach(c => { const pd = { id:ID('pd'), num:++d.nums.pedido, prov:c.prov, f:sumarDias(c.f, -3), it:c.it.map(i => ({ p:i.p, c:i.c, r:i.c })), nota:'', u:'Dueños' }; d.pedidos.push(pd); c.pedido = pd.id; });
  const parcial = pedido(-6, 'pv2', [['P005', 8, 0], ['P009', 48, 48], ['P001', 10, 6]], 'El impermeabilizante lo mandan la semana que viene');
  (() => {   // lo que llegó del pedido parcial
    const f = sumarDias(h, -4), it = [{ p:P('P009').id, c:48, co:150, lote:'SI-5610', vence:sumarDias(h, 300) }, { p:P('P001').id, c:6, co:3400, lote:'LX-1244', vence:sumarDias(h, 300) }];
    const cp = { id:ID('cp'), prov:'pv2', fac:'A ' + (++nFac), f, it, tot:it.reduce((s, i) => s + i.c * i.co, 0), cond:'credito', venc:sumarDias(f, 30), pedido:parcial.id, u:'Diego (funcionario)' };
    d.compras.push(cp); it.forEach(i => mov(f, '10:10', i.p, i.c, 'compra', 'Pedido Nº ' + parcial.num + ' (parcial)', 'Diego (funcionario)', i.lote));
  })();
  pedido(-2, 'pv1', [['C001', 80], ['C002', 30], ['C005', 2000]], 'Entregar martes de mañana');
  pedido(-1, 'pv5', [['E007', 6], ['E005', 60]], '');
  d.compras.sort((a, b) => a.f.localeCompare(b.f));

  /* ---- Cobros de cuentas corrientes (a mes vencido; la herrería está atrasada) ---- */
  _cache = {};
  d.clientes.forEach(c => {
    const porMes = {};
    d.ventas.filter(v => v.cli === c.id && v.pago === 'Cuenta corriente' && v.est !== 'anulada').forEach(v => { const m = mesClave(v.f); porMes[m] = (porMes[m] || 0) + netoVenta(v); });
    Object.keys(porMes).sort().forEach(m => {
      const f = sumarDias(sumarMeses(m + '-01', 1), 9);
      if (f > h || (c.id === 'cl4' && f > sumarDias(h, -70))) return;
      d.cobros.push({ id:ID('co'), f, cli:c.id, monto:porMes[m], medio: rnd() < .7 ? 'Transferencia' : 'Efectivo', u:'Dueños', nota:'Pago de ' + MESES[Number(m.slice(5)) - 1] });
    });
  });
  // Cobro parcial de la cooperativa este mes
  d.cobros.push({ id:ID('co'), f:sumarDias(h, -3), cli:'cl3', monto:25000, medio:'Transferencia', u:'Dueños', nota:'A cuenta' });

  /* ---- Gastos, retiros y aportes ---- */
  const gasto = (f, cat, monto, medio, nota, extra) => { if (f <= h) d.dinero.push(Object.assign({ id:ID('d'), f, h:'12:00', tipo:'gasto', cat, monto, medio, nota, u:'Dueños' }, extra || {})); };
  for (let m = -6; m <= 0; m++){
    const ini = sumarMeses(inicioMes(h), m), dia = n => sumarDias(ini, n - 1);
    gasto(dia(5), 'Alquiler', 38000, 'Transferencia', 'Alquiler del local');
    gasto(dia(12), 'UTE', R(5800, 7300), 'Débito', 'Factura UTE');
    gasto(dia(14), 'OSE', R(1050, 1450), 'Débito', 'Factura OSE');
    gasto(dia(18), 'Antel', 2390, 'Débito', 'Teléfono e internet');
    gasto(dia(20), 'Impuestos', R(16500, 19500), 'Transferencia', 'DGI y BPS');
    [3, 10, 17, 24].forEach(n => gasto(dia(n), 'Combustible', R(2100, 2900), 'Efectivo', 'Gasoil camioneta'));
    [8, 22].forEach(n => gasto(dia(n), 'Fletes', R(1200, 2400), 'Efectivo', 'Flete tercerizado'));
    [6, 15, 27].forEach(n => gasto(dia(n), 'Otros', R(600, 2800), 'Efectivo', elegir(['Artículos de limpieza', 'Librería', 'Reparación de estantería', 'Cartelería'])));
    gasto(dia(15), 'Sueldos', 5000, 'Efectivo', 'Adelanto de sueldo', { concepto:'Adelanto' });
    gasto(dia(3), 'Sueldos', 27000, 'Transferencia', 'Sueldo del mes anterior (menos adelanto)', { concepto:'Sueldo' });
    SOCIOS.forEach((s, k) => { const f = dia(28 + k); if (f <= h) d.dinero.push({ id:ID('d'), f, h:'18:30', tipo:'retiro', socio:s, cat:'', monto:30000, medio:'Transferencia', nota:'Retiro mensual', u:'Dueños' }); });
  }
  d.dinero.push({ id:ID('d'), f:sumarDias(h, -150), h:'10:00', tipo:'aporte', socio:'Jorge', cat:'', monto:100000, medio:'Transferencia', nota:'Compra de mercadería de temporada', u:'Dueños' });

  /* ---- Comisiones: meses anteriores liquidados (el último, todavía sin pagar) ---- */
  _cache = {};
  for (let m = -5; m <= -1; m++){
    const desde = sumarMeses(inicioMes(h), m), hasta = finMes(desde);
    const r = comisionAPagar(desde, hasta);
    if (!r.cobradas.length) continue;
    const pagada = m < -1, fPago = sumarDias(sumarMeses(desde, 1), 4);
    d.liquidaciones.push({ id:ID('lq'), desde, hasta, ventas:r.cobradas.map(v => v.id), base:Math.round(r.base), monto:Math.round(r.total), f:sumarDias(hasta, 2), pagada, fPago: pagada ? fPago : '', u:'Dueños' });
    if (pagada) gasto(fPago, 'Sueldos', Math.round(r.total), 'Transferencia', 'Comisión de ' + fMes(desde), { concepto:'Comisión' });
    _cache = {};
  }

  /* ---- Asistencia del funcionario (últimos 4 meses) ---- */
  for (let dd = -120; dd < 0; dd++){
    const f = sumarDias(h, dd); if (diaSemana(f) === 0) continue;
    d.asist[f] = (dd === -33 || dd === -8) ? 'F' : (dd >= -70 && dd <= -66) ? 'L' : 'T';
  }
  if (diaSemana(h) !== 0) d.asist[h] = 'T';

  /* ---- Ajustes de stock, inventario y presupuestos ---- */
  mov(sumarDias(h, -18), '17:10', P('P002').id, -1, 'ajuste', 'Rotura · se cayó el balde', 'Dueños');
  mov(sumarDias(h, -9), '12:40', P('E005').id, -2, 'ajuste', 'Uso interno · iluminación del depósito', 'Dueños');
  mov(sumarDias(h, -31), '19:00', P('F002').id, -1.5, 'inventario', 'Inventario físico · Ferretería', 'Dueños');
  mov(sumarDias(h, -31), '19:00', P('F005').id, 2, 'inventario', 'Inventario físico · Ferretería', 'Dueños');
  d.inventarios.push({ id:ID('in'), f:sumarDias(h, -31), cat:'Ferretería', u:'Dueños', dif:[{ p:P('F002').id, sis:47.5, real:46 }, { p:P('F005').id, sis:28, real:30 }] });

  const presu = (dd, cl, nom, tel, lista, est) => {
    const it = lista.map(([cod, c]) => { const p = P(cod); return { p:p.id, n:p.nombre, c, pr:p.precio }; });
    const sub = it.reduce((s, i) => s + i.c * i.pr, 0);
    d.presupuestos.push({ id:ID('pp'), num:++d.nums.presupuesto, f:sumarDias(h, dd), cli:cl, nom, tel, it, sub, desc:0, tot:sub, val:d.config.validezPresupuesto, est, venta:null, u:'Dueños' });
  };
  presu(-20, null, 'Rosa Viera', '099 000 501', [['C001', 30], ['C003', 3], ['C004', 2], ['C007', 20]], 'abierto');
  presu(-5, 'cl2', '', '', [['S001', 12], ['S003', 20], ['S004', 2], ['S007', 1]], 'abierto');
  presu(-2, null, 'Esteban Rocha', '099 000 502', [['P001', 4], ['P007', 2], ['P008', 3], ['P012', 2]], 'abierto');
  presu(0, 'cl5', '', '', [['E001', 200], ['E003', 12], ['E004', 15], ['E007', 2]], 'abierto');

  /* ---- Stock: lo reservado (entregas y acopios pendientes) se suma a lo disponible ---- */
  _cache = {};
  d.productos.forEach(p => {
    const res = reservadoDe(p.id); if (res <= 0) return;
    if (!p.vence) p.stock = r2(p.stock + res);
    else { const l = lotesOrdenados(p).filter(x => x.c > 0).pop(); if (l) l.c = r2(l.c + res); else p.lotes.push({ id:ID('l'), lote:'L-' + R(1000, 9999), c:res, vence:sumarDias(h, 250) }); }
  });
  d.productos.forEach(p => { delete p._peso; delete p._q; });

  /* ---- Caja: los últimos días cerrados, hoy abierta ---- */
  _cache = {};
  const difs = [0, -50, 0, 20, 0, 0, -100, 0, 10, 0, 0, -20];
  for (let dd = -16, k = 0; dd <= 0; dd++){
    const f = sumarDias(h, dd); if (diaSemana(f) === 0) continue;
    d.caja[f] = { ap:5000, apH:'08:00', apU:'Dueños' };
    if (dd < 0){ _cache = {}; const c = cajaDelDia(f); d.caja[f].cierre = { contado:c.esperado + difs[k++ % difs.length], esperado:c.esperado, h:'19:10', u:'Dueños', nota:'' }; }
  }

  d.mstock.sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));
  d.dinero.sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));
  d.cobros.sort((a, b) => b.f.localeCompare(a.f));
  // Registro de actividad (lo de hoy)
  d.ventas.filter(v => v.f === h).forEach(v => d.log.unshift({ f:h, h:v.h, u:v.u, a:'Registró la venta Nº ' + v.num + ' por ' + pesos(v.tot) }));
  d.log.push({ f:h, h:'08:00', u:'Dueños', a:'Abrió la caja con ' + pesos(5000) });
  d.log.sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));
  _cache = {};
  return d;
}

/* ---------- Presentación (lo primero que se ve al abrir el link) ---------- */
function miniApp(){   // maqueta a escala de la página, con los colores de El Yunque
  const r = (h, n) => h.repeat(n);
  return `<div class="bv-prev"><div class="mini-app">
    <div class="mini-lat"><img src="${LOGO_YUNQUE_CHICO}" alt=""><div class="mini-venta"></div><div class="mini-it on"></div>${r('<div class="mini-it"></div>', 7)}</div>
    <div class="mini-body"><div class="mini-tit"></div>
      <div class="mini-kpis">${r('<div class="mini-kpi"></div>', 4)}</div>
      <div class="mini-cols">
        <div class="mini-card"><div class="mini-row"></div><div class="mini-row r"></div><div class="mini-row"></div><div class="mini-row a"></div></div>
        <div class="mini-card"><div class="mini-bar"><i style="height:45%"></i><i style="height:30%"></i><i style="height:62%"></i><i style="height:40%"></i><i style="height:80%"></i><i style="height:52%"></i></div></div>
      </div></div></div></div>`;
}
function mostrarBienvenida(){
  $('#bv-logo').src = LOGO_WYDAN_HORIZONTAL;
  $('#bv-nombre').textContent = BV_NOMBRE;
  $('#bv-rol').textContent = BV_ROL;
  $('#bv-frase').textContent = BV_FRASE;
  $('#bv-vista').innerHTML = miniApp();
  $('#bloqueo').classList.add('hidden'); $('#app').classList.add('hidden');
  $('#bienvenida').classList.remove('hidden');
  $('#bienvenida').scrollTop = 0;
}
function entrarDemo(){ $('#bienvenida').classList.add('hidden'); mostrarBloqueo(); }

/* ---------- Pantalla de bloqueo ----------
   IMPORTANTE: es un bloqueo VISUAL para la demostración, no una seguridad real.
   En la versión real, intentarIngreso() se reemplaza por Firebase Authentication:
     firebase.auth().signInWithEmailAndPassword(correo, clave)
   y lo que ve cada usuario se controla en firestore.rules (no en el navegador). */
let _perfilElegido = 'duenos';
function saludo(){ const h = new Date().getHours(); return h < 12 ? 'Buen día' : (h < 20 ? 'Buenas tardes' : 'Buenas noches'); }
function mostrarBloqueo(){
  $('#bq-logo').src = LOGO_YUNQUE;
  $('#bq-engranaje').innerHTML = engranaje(16);
  $('#bq-wydan').src = LOGO_WYDAN_ICONO;
  $('#bq-fecha').textContent = saludo() + ' · ' + fLarga(hoy());
  $('#bq-ojo').innerHTML = ico('ojo');
  $('#bq-pass').type = 'password'; $('#bq-pass').value = '';
  $('#bq-error').textContent = '';
  pintarPerfiles();
  $('#app').classList.add('hidden');
  $('#bloqueo').classList.remove('hidden', 'saliendo');
  if (window.innerWidth > 700) setTimeout(() => $('#bq-pass').focus(), 120);
}
function pintarPerfiles(){
  $('#bq-perfiles').innerHTML = Object.keys(USUARIOS).map(k => { const u = USUARIOS[k];
    return `<button type="button" class="bq-perfil ${k === _perfilElegido ? 'on' : ''}" role="radio" aria-checked="${k === _perfilElegido}" onclick="elegirPerfil('${k}')">
      <span class="avatar">${ico(k === 'duenos' ? 'llave' : 'usuario')}</span><b>${u.nombre}</b><small>${u.quien} · ${u.desc}</small></button>`; }).join('');
}
function elegirPerfil(k){ _perfilElegido = k; pintarPerfiles(); $('#bq-pass').focus(); }
function alternarClave(){
  const i = $('#bq-pass'), ver = i.type === 'password';
  i.type = ver ? 'text' : 'password';
  $('#bq-ojo').innerHTML = ico(ver ? 'ojoNo' : 'ojo');
  $('#bq-ojo').setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
  i.focus();
}
function intentarIngreso(){
  const i = $('#bq-pass'), t = $('#bq-form');
  if (i.value === USUARIOS[_perfilElegido].clave){
    PERFIL = _perfilElegido;
    registrar('Ingresó a la página');
    guardar();
    $('#bq-error').textContent = '';
    $('#bloqueo').classList.add('saliendo');
    setTimeout(() => { $('#bloqueo').classList.add('hidden'); abrirApp(); }, 550);
  } else {
    $('#bq-error').textContent = 'Contraseña incorrecta';
    t.classList.remove('sacudir'); void t.offsetWidth; t.classList.add('sacudir');
    i.select();
  }
}
function bloquear(){
  cerrarMenu(); cerrarCampana(); if (modalAbierto()) cerrarModal();
  if (PERFIL){ registrar('Bloqueó la página'); guardar(); }
  PERFIL = null;
  mostrarBloqueo(); window.scrollTo(0, 0);
}

/* =====================================================================

   ===================================================================== */
function alertas(){
  return memo('alertas', () => {
    const a = [], h = hoy(), P = D().productos.map(p => [p, info(p)]);
    const cuenta = e => P.filter(([p, i]) => i.estados.includes(e));
    const falta = cuenta('falta'), bajo = cuenta('bajo'), venc = cuenta('vencido');
    const prox30 = P.filter(([p, i]) => i.prox30 > 0);
    if (falta.length) a.push({ n:falta.length, t:'Productos en falta', sub:falta.slice(0, 3).map(([p]) => p.nombre).join(' · '), nivel:'rojo', sec:'stock', ir:"verStock('falta')" });
    if (venc.length) a.push({ n:venc.length, t:'Productos con lotes vencidos', sub:'Sacarlos de la venta o hacer el ajuste', nivel:'rojo', sec:'stock', ir:"verStock('vencido')" });
    if (bajo.length) a.push({ n:bajo.length, t:'Productos bajo el mínimo', sub:'Ver la lista de compra sugerida', nivel:'amarillo', sec:'stock', ir:"verStock('bajo')" });
    if (prox30.length) a.push({ n:prox30.length, t:'Vencen en los próximos 30 días', sub:'Conviene venderlos primero', nivel:'amarillo', sec:'stock', ir:"verStock('proximo')" });
    const ent = entregasPendientesHoy(), atr = ent.filter(v => v.ent.f < h);
    if (ent.length) a.push({ n:ent.length, t:'Entregas para hoy sin terminar', sub: atr.length ? atr.length + ' atrasada' + (atr.length > 1 ? 's' : '') + ' de días anteriores' : 'Ver la hoja de ruta', nivel: atr.length ? 'rojo' : 'azul', sec:'entregas', ir:"ir('entregas')" });
    const pedAtr = D().pedidos.filter(pd => estadoPedido(pd) !== 'recibido' && difDias(pd.f, h) > 5);
    if (pedAtr.length) a.push({ n:pedAtr.length, t:'Pedidos a proveedores demorados', sub:'Hace más de 5 días que se pidieron', nivel:'amarillo', sec:'compras', ir:"verCompras('pedidos')" });
    if (esDueno()){
      const pf = D().ventas.filter(pendienteFactura);
      if (pf.length) a.push({ n:pf.length, t:'Ventas pendientes de factura', sub:pesos(pf.reduce((s, v) => s + netoVenta(v), 0)) + ' sin facturar', nivel:'amarillo', sec:'vender', ir:"verVentas('pendiente')" });
      const cp = cpIndice(), pagar = []; Object.values(cp).forEach(x => x.pendientes.forEach(p => { if (p.compra.venc && difDias(h, p.compra.venc) <= 7) pagar.push(p); }));
      const vencidas = pagar.filter(p => p.compra.venc < h);
      if (pagar.length) a.push({ n:pagar.length, t:'Facturas de proveedores por pagar', sub:(vencidas.length ? vencidas.length + ' vencida' + (vencidas.length > 1 ? 's' : '') + ' · ' : '') + 'vencen en 7 días o menos', nivel: vencidas.length ? 'rojo' : 'amarillo', sec:'finanzas', ir:"verFinanzas('cuentas')" });
      const sobre = D().clientes.filter(c => c.limite > 0 && saldoCliente(c.id) > c.limite);
      if (sobre.length) a.push({ n:sobre.length, t:'Clientes por encima de su límite', sub:sobre.map(c => c.nombre).join(' · '), nivel:'rojo', sec:'clientes', ir:"verClientes('limite')" });
      const caja = D().caja[h];
      if (!caja && diaSemana(h) !== 0) a.push({ n:1, t:'La caja de hoy no está abierta', sub:'Abrirla para controlar el efectivo', nivel:'azul', sec:'finanzas', ir:"verFinanzas('caja')" });
    }
    return a;
  });
}

/* =====================================================================
   BUSCADOR GENERAL (nombre, código, código de barras, RUT o Nº de venta)
   ===================================================================== */
let _busqSel = 0;
function resultadosBusqueda(q){
  q = sinTildes(q.trim()); if (q.length < 2) return [];
  const r = [], n = q.replace(/\s/g, '');
  D().productos.filter(p => sinTildes(p.nombre + ' ' + p.cod + ' ' + p.marca).includes(q) || p.barras === n || sinTildes(p.cod) === n).slice(0, 7)
    .forEach(p => r.push({ g:'Productos', t:p.nombre, s:p.cod + ' · disp. ' + cant(disponibleDe(p)) + ' ' + unidadCorta(p), fn:`fichaProducto('${p.id}')` }));
  D().clientes.filter(c => sinTildes(c.nombre + ' ' + c.doc).includes(q) || c.doc.replace(/\D/g, '').includes(n.replace(/\D/g, '') || 'x')).slice(0, 5)
    .forEach(c => r.push({ g:'Clientes', t:c.nombre, s:c.tdoc + ' ' + c.doc, fn:`fichaCliente('${c.id}')` }));
  D().proveedores.filter(p => sinTildes(p.nombre + ' ' + p.rut).includes(q) || p.rut.replace(/\D/g, '').includes(n.replace(/\D/g, '') || 'x')).slice(0, 4)
    .forEach(p => r.push({ g:'Proveedores', t:p.nombre, s:'RUT ' + p.rut, fn:`fichaProveedor('${p.id}')` }));
  const num = Number(q.replace(/[^\d]/g, ''));
  if (num){ const v = D().ventas.find(x => x.num === num); if (v) r.push({ g:'Ventas', t:'Venta Nº ' + v.num, s:fCorta(v.f) + ' · ' + pesos(v.tot) + ' · ' + nombreCli(v.cli), fn:`fichaVenta('${v.id}')` }); }
  return r;
}
function pintarBusqueda(){
  const q = $('#busq-global').value, r = resultadosBusqueda(q), caja = $('#busq-res');
  if (q.trim().length < 2){ caja.classList.add('hidden'); return; }
  let g = '';
  caja.innerHTML = r.length ? r.map((x, i) => (x.g !== g ? `<div class="busq-grupo">${(g = x.g)}</div>` : '') +
    `<button class="busq-it ${i === _busqSel ? 'sel' : ''}" onclick="cerrarBusqueda(); ${x.fn}"><span>${esc(x.t)}</span><small>${esc(x.s)}</small></button>`).join('')
    : `<div class="vacio">No se encontró «${esc(q)}»</div>`;
  caja.classList.remove('hidden');
}
function cerrarBusqueda(){ const c = $('#busq-res'); if (c) c.classList.add('hidden'); document.body.classList.remove('busq-movil'); }
function abrirBusquedaMovil(){ document.body.classList.add('busq-movil'); setTimeout(() => $('#busq-global').focus(), 30); }
function prepararBuscador(){
  const i = $('#busq-global');
  i.addEventListener('input', () => { _busqSel = 0; pintarBusqueda(); });
  i.addEventListener('focus', pintarBusqueda);
  i.addEventListener('keydown', e => {
    const r = resultadosBusqueda(i.value);
    if (e.key === 'ArrowDown'){ _busqSel = Math.min(r.length - 1, _busqSel + 1); pintarBusqueda(); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ _busqSel = Math.max(0, _busqSel - 1); pintarBusqueda(); e.preventDefault(); }
    else if (e.key === 'Enter' && r[_busqSel]){ e.preventDefault(); const fn = r[_busqSel].fn; i.value = ''; cerrarBusqueda(); i.blur(); new Function(fn)(); }
    else if (e.key === 'Escape'){ i.value = ''; cerrarBusqueda(); i.blur(); }
  });
}

/* =====================================================================
   INICIO · distinto según quién entra
   - Funcionario: sus ventas del día, entregas de hoy y alertas de stock.
   - Dueños: además caja, ventas del mes, facturación, stock y cuentas.
   ===================================================================== */
RENDER.inicio = function(){
  const h = hoy(), dueno = esDueno();
  const hoyV = D().ventas.filter(v => v.f === h && ventaActiva(v));
  const mias = dueno ? hoyV : hoyV.filter(v => v.vend === 'func');
  const totHoy = mias.reduce((s, v) => s + netoVenta(v), 0);
  const ent = entregasPendientesHoy();
  const prods = D().productos.map(p => [p, info(p)]);
  const n = e => prods.filter(([p, i]) => i.estados.includes(e)).length;
  const prox = prods.filter(([p, i]) => i.prox30 + i.prox60 > 0).length;

  encabezado(saludo() + ', ' + USUARIOS[PERFIL].quien,
    dueno ? 'Así viene el negocio hoy.' : 'Tus ventas de hoy y lo que hay que mirar del stock.',
    `<button class="btn btn-linea" onclick="nuevoPresupuesto()">${ico('presupuesto')} Nuevo presupuesto</button>`);

  let html = `<div class="grid g-4">
    ${kpi(dueno ? 'Ventas de hoy' : 'Mis ventas de hoy', pesos(totHoy), mias.length + ' venta' + (mias.length === 1 ? '' : 's'), { ico:'vender', cls:'k-naranja', click:"verVentas('hoy')" })}
    ${kpi('Entregas de hoy', ent.length, ent.length ? ent.filter(v => v.ent.est === 'camino').length + ' en camino' : 'Nada pendiente', { ico:'camion', click:"ir('entregas')" })}
    ${kpi('En falta', n('falta'), n('bajo') + ' más bajo el mínimo', { ico:'alerta', cls: n('falta') ? 'k-rojo' : '', click:"verStock('falta')" })}
    ${kpi('Próximos a vencer', prox, n('vencido') ? n('vencido') + ' con lotes vencidos' : 'En los próximos ' + D().config.diasVence + ' días', { ico:'vence', cls: n('vencido') ? 'k-rojo' : (prox ? 'k-amarillo' : ''), click:"verStock('proximo')" })}
  </div>`;

  if (dueno){
    const caja = cajaDelDia(h), mes = resultadoMes(mesClave(h));
    const mesAnt = resultadoMes(mesClave(sumarMeses(h, -1)));
    const diaMes = aFecha(h).getDate();
    const antMismoDia = D().ventas.filter(v => ventaActiva(v) && mesClave(v.f) === mesAnt.mes && aFecha(v.f).getDate() <= diaMes).reduce((s, v) => s + netoVenta(v), 0);
    const varMes = antMismoDia ? (mes.vendido - antMismoDia) / antMismoDia * 100 : 0;
    const pf = D().ventas.filter(pendienteFactura), pfM = pf.reduce((s, v) => s + netoVenta(v), 0);
    const vs = valorStock(), inm = inmovilizado();
    const cc = ccIndice().porCli, aCobrar = Object.values(cc).reduce((s, x) => s + Math.max(0, x.saldo), 0);
    const cp = cpIndice(); let aPagar7 = 0, aPagarTot = 0;
    Object.values(cp).forEach(x => x.pendientes.forEach(p => { aPagarTot += p.debe; if (p.compra.venc && difDias(h, p.compra.venc) <= 7) aPagar7 += p.debe; }));
    const com = comisionAPagar(inicioMes(h), h), liqImp = D().liquidaciones.filter(l => !l.pagada).reduce((s, l) => s + l.monto, 0);
    html += `<div class="grid g-4 mt">
      ${kpi('Caja del día', caja.abierta ? pesos(caja.esperado) : 'Sin abrir', caja.abierta ? 'Efectivo que debería haber' + (caja.cierre ? ' · cerrada' : '') : 'Abrirla desde Finanzas', { ico:'caja', click:"verFinanzas('caja')" })}
      ${kpi('Ventas del mes', pesos(mes.vendido), mes.n + ' ventas · ' + (varMes >= 0 ? '▲ ' : '▼ ') + pct(Math.abs(varMes)) + ' contra el mes pasado a esta altura', { ico:'finanzas', click:"verFinanzas('resultado')" })}
      ${kpi('Pendientes de factura', pf.length, pesos(pfM) + ' sin facturar', { ico:'factura', cls: pf.length ? 'k-amarillo' : '', click:"verVentas('pendiente')" })}
      ${kpi('Comisiones a pagar', pesos(com.total + liqImp), (liqImp ? pesos(liqImp) + ' ya liquidado · ' : '') + 'acumulado del mes ' + pesos(com.total), { ico:'personal', click:"verPersonal('comisiones')" })}
    </div>
    <div class="grid g-4 mt">
      ${kpi('Valor del stock', pesos(vs.costo), 'A costo · ' + pesos(vs.venta) + ' a precio de venta', { ico:'stock', click:"verStock('todos')" })}
      ${kpi('Plata inmovilizada', pesos(inm.monto), inm.lista.length + ' productos sin ventas en ' + D().config.diasSinVentas + ' días', { ico:'reloj', cls: inm.monto ? 'k-amarillo' : '', click:"verStock('sinmov')" })}
      ${kpi('Cuentas a cobrar', pesos(aCobrar), 'Saldo de cuentas corrientes de clientes', { ico:'clientes', click:"verFinanzas('cuentas')" })}
      ${kpi('Cuentas a pagar', pesos(aPagar7), 'Vencen en 7 días · total ' + pesos(aPagarTot), { ico:'compras', cls: aPagar7 ? 'k-amarillo' : '', click:"verFinanzas('cuentas')" })}
    </div>`;
  }

  // Detalle: ventas de hoy + lo que hay que mirar
  const atencion = prods.filter(([p, i]) => ['falta', 'vencido', 'bajo'].includes(i.estado) || i.prox30 > 0)
    .sort((a, b) => ['falta', 'vencido', 'bajo', 'proximo'].indexOf(a[1].estado) - ['falta', 'vencido', 'bajo', 'proximo'].indexOf(b[1].estado)).slice(0, 8);
  html += `<div class="grid g-2 mt">
    <div class="card">
      <div class="card-cab"><div class="card-t">${dueno ? 'Ventas de hoy' : 'Mis ventas de hoy'} <span class="card-num">${mias.length}</span></div><a class="link" onclick="verVentas('hoy')">Ver todas ${ico('der')}</a></div>
      ${mias.length ? `<div class="lista">${mias.slice().reverse().slice(0, 7).map(filaVentaCorta).join('')}</div>` : vacio('Todavía no hay ventas hoy. Tocá <b>Nueva venta</b> para empezar.')}
    </div>
    <div class="card">
      <div class="card-cab"><div class="card-t">Stock para mirar <span class="card-num">${atencion.length}</span></div><a class="link" onclick="verStock('alertas')">Ver alertas ${ico('der')}</a></div>
      ${atencion.length ? `<div class="lista">${atencion.map(([p, i]) => `<button class="fila-lista" onclick="fichaProducto('${p.id}')">
        <span><span class="p-nombre">${esc(p.nombre)}</span><span class="p-cod">${p.cod} · disponible ${cant(i.disp)} ${unidadCorta(p)} · mínimo ${cant(p.min)}</span></span>
        ${chipEstadoProd(i.estado === 'normal' || i.estado === 'sinmov' ? 'proximo' : i.estado)}</button>`).join('')}</div>` : vacio('El stock está en orden.')}
    </div>
  </div>`;
  if (ent.length) html += `<div class="card mt"><div class="card-cab"><div class="card-t">Entregas de hoy <span class="card-num">${ent.length}</span></div>
    <button class="btn btn-linea btn-sm" onclick="imprimirHojaRuta('${h}')">${ico('imprimir')} Hoja de ruta</button></div>
    <div class="lista">${ent.map(v => `<button class="fila-lista" onclick="fichaEntrega('${v.id}')"><span><span class="p-nombre">${esc(nombreCli(v.cli))}</span>
      <span class="p-cod">${ico('pin')} ${esc(v.ent.dir)} · ${esc(v.ent.zona)}${v.ent.f < h ? ' · <b class="neg">atrasada desde ' + fMedia(v.ent.f) + '</b>' : ''}</span></span>${chipEntrega(v.ent.est)}</button>`).join('')}</div></div>`;
  $('#vista').innerHTML = html;
};

function filaVentaCorta(v){
  return `<button class="fila-lista" onclick="fichaVenta('${v.id}')">
    <span><span class="p-nombre">Nº ${v.num} · ${esc(nombreCli(v.cli))}</span><span class="p-cod">${v.h} · ${v.it.length} producto${v.it.length > 1 ? 's' : ''} · ${v.pago} · ${vendedorTxt(v)}</span></span>

const EST_VENDER = { tab:'mostrador' };

let _qPos = '';

RENDER.vender = function(){

async function nuevaVenta(){

    const seguir = await confirmar('Hay una venta sin terminar', `Tiene ${CARRO.it.length} producto${CARRO.it.length > 1 ? 's' : ''} cargado${CARRO.it.length > 1 ? 's' : ''}. ¿Querés seguir con esa o empezar una nueva?`, 'Seguir con esa');

  $('#vender-cuerpo').innerHTML = `<div class="pos-caja">

      <div class="pos-busca">${ico('barras')}<input id="pos-buscar" type="search" autocomplete="off" placeholder="Nombre, código o escaneá el código de barras" value="${esc(_qPos)}"
        aria-label="Buscar producto"></div>
      <div id="pos-res"></div>
    </div>
    <div class="pos-der"><div class="ticket" id="ticket"></div></div>
  </div>
  <div class="pos-barra" id="pos-barra"></div>`;
  const i = $('#pos-buscar');
  i.addEventListener('input', () => { _qPos = i.value; pintarResultadosPos(); });
  i.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); enterPos(); } });
  pintarResultadosPos(); pintarTicket();
  if (window.innerWidth > 900) setTimeout(() => i.focus(), 50);
}
function buscarProductos(q){
  q = sinTildes(q.trim()); if (!q) return [];
  const pal = q.split(/\s+/);
  return D().productos.filter(p => { const t = sinTildes(p.nombre + ' ' + p.cod + ' ' + p.marca + ' ' + p.cat + ' ' + p.barras); return pal.every(w => t.includes(w)); }).slice(0, 30);
}
function pintarResultadosPos(){
  const q = _qPos.trim(), caja = $('#pos-res'); if (!caja) return;
  const tarjeta = p => { const i = info(p), sinDisp = i.disp <= 0;
    return `<button class="pos-prod ${sinDisp ? 'agotado' : ''}" onclick="agregarAlCarro('${p.id}')">
      <span class="pp-n">${esc(p.nombre)}</span>
      <span class="pp-c">${p.cod}${p.vence ? ' · ' + ico('vence') : ''}</span>
      <span class="pp-pie"><b class="num">${pesos(p.precio)}</b><small class="${sinDisp ? 'neg' : i.disp <= p.min ? 'am' : ''}">${sinDisp ? 'Sin disponible' : 'Disp. ' + cant(i.disp) + ' ' + unidadCorta(p)}</small></span></button>`; };
  if (!q){
    const top = D().productos.map(p => [p, info(p).vendMes]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => x[0]);
    caja.innerHTML = `<div class="pos-sub">${ico('estrella')} Los más vendidos del mes · tocá para agregar</div><div class="pos-grilla">${top.map(tarjeta).join('')}</div>`;
    return;
  }
  const r = buscarProductos(q);
  caja.innerHTML = r.length ? `<div class="pos-sub">${r.length} resultado${r.length > 1 ? 's' : ''} · Enter agrega el primero</div><div class="pos-grilla">${r.map(tarjeta).join('')}</div>`
    : vacio(`No hay productos con «${esc(q)}».` + (esDueno() ? ` <br><button class="btn btn-linea btn-sm mt-s" onclick="formProducto()">${ico('mas')} Crear producto</button>` : ''));
}
function enterPos(){
  const q = _qPos.trim(); if (!q) return;
  const exacto = D().productos.find(p => p.barras === q || p.cod.toLowerCase() === q.toLowerCase());
  const r = exacto ? [exacto] : buscarProductos(q);
  if (!r.length){ error('No se encontró «' + esc(q) + '»'); return; }
  agregarAlCarro(r[0].id);
  _qPos = ''; $('#pos-buscar').value = ''; pintarResultadosPos();
}

/* ---------- El carro (ticket) ---------- */
function agregarAlCarro(pid, c){
  const p = producto(pid); if (!p) return;
  const paso = pasoDe(p), ya = CARRO.it.find(i => i.p === pid);
  if (ya) ya.c = r2(ya.c + (c || paso));
  else CARRO.it.push({ p:pid, n:p.nombre, c:c || paso, pr:p.precio });
  if (seccionActual === 'vender' && EST_VENDER.tab === 'mostrador'){
    pintarTicket();
    const el = $(`#tk-${pid}`); if (el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    const i = $('#pos-buscar'); if (i && window.innerWidth > 900) i.focus();
  }
}
function cambiarCant(pid, val, delta){
  const it = CARRO.it.find(i => i.p === pid); if (!it) return;
  const paso = pasoDe(producto(pid));
  let c = delta ? r2(it.c + delta * paso) : Number(String(val).replace(',', '.'));
  if (!(c > 0)){ if (delta) c = paso; else return pintarTicket(); }
  it.c = paso >= 1 && producto(pid).unidad !== 'kg' ? Math.round(c) || 1 : r2(c);
  pintarTicket();
}
function quitarDelCarro(pid){ CARRO.it = CARRO.it.filter(i => i.p !== pid); pintarTicket(); }
function vaciarCarro(silencio){ CARRO = { it:[], cli:null, descTipo:'%', descVal:0, pre:null }; if (!silencio && seccionActual === 'vender') pintarTicket(); }
function totalesCarro(){
  const sub = CARRO.it.reduce((s, i) => s + i.c * i.pr, 0);
  let desc = CARRO.descTipo === '%' ? Math.round(sub * (Number(CARRO.descVal) || 0) / 100) : Math.round(Number(CARRO.descVal) || 0);
  desc = Math.max(0, Math.min(desc, sub));
  return { sub, desc, tot:sub - desc, pctDesc: sub ? desc / sub * 100 : 0 };
}
function pintarTicket(){
  const caja = $('#ticket'); if (!caja) return;
  const t = totalesCarro(), c = cliente(CARRO.cli);
  const filas = CARRO.it.map(i => { const p = producto(i.p), disp = disponibleDe(p), pasa = i.c > disp;
    return `<div class="tk-it" id="tk-${i.p}">
      <div class="tk-n"><b>${esc(i.n)}</b><small>${pesos(i.pr)} / ${unidadCorta(p)}${pasa ? ` · <span class="neg">${disp > 0 ? 'hay ' + cant(disp) + ' disponibles' : 'sin disponible'}</span>` : ''}</small></div>
      <div class="tk-cant"><button onclick="cambiarCant('${i.p}',0,-1)" aria-label="Menos">${ico('menos')}</button>
        <input value="${cant(i.c)}" inputmode="decimal" aria-label="Cantidad" onchange="cambiarCant('${i.p}',this.value)" onfocus="this.select()">
        <button onclick="cambiarCant('${i.p}',0,1)" aria-label="Más">${ico('mas')}</button></div>
      <div class="tk-sub num">${pesos(i.c * i.pr)}</div>
      <button class="tk-x" onclick="quitarDelCarro('${i.p}')" aria-label="Quitar">${ico('x')}</button></div>`; }).join('');
  const tope = !esDueno() ? `<small class="muted">Tope para el funcionario: ${D().config.topeDescFunc} %</small>` : '';
  caja.innerHTML = `<div class="tk-cab">
      <div class="tk-t">${CARRO.modo === 'pres' ? 'Nuevo presupuesto' : CARRO.pre ? 'Venta desde presupuesto' : 'Nueva venta'}</div>
      ${CARRO.it.length ? `<button class="link" onclick="vaciarCarro()">Vaciar</button>` : ''}</div>
    <button class="tk-cli" onclick="elegirClienteVenta()">${ico('clientes')}<span><small>Cliente</small><b>${esc(c ? c.nombre : 'Consumidor final')}</b>
      ${c && c.limite ? `<small>Cuenta corriente: saldo ${pesos(saldoCliente(c.id))} de ${pesos(c.limite)}</small>` : ''}</span><span class="link">Cambiar</span></button>
    <div class="tk-items">${filas || `<div class="tk-vacio">${engranaje(12)}Agregá productos desde la izquierda<br><small>o escaneá el código de barras</small></div>`}</div>
    ${CARRO.it.length ? `<div class="tk-desc"><span>Descuento</span>
      <div class="segmento seg-chico"><button class="${CARRO.descTipo === '%' ? 'on' : ''}" onclick="CARRO.descTipo='%';pintarTicket()">%</button><button class="${CARRO.descTipo === '$' ? 'on' : ''}" onclick="CARRO.descTipo='$';pintarTicket()">$</button></div>
      <input value="${CARRO.descVal || ''}" placeholder="0" inputmode="decimal" aria-label="Descuento" onchange="CARRO.descVal=Number(this.value.replace(',','.'))||0;pintarTicket()">${tope}</div>
    <div class="tk-tot"><div><span>Subtotal</span><span class="num">${pesos(t.sub)}</span></div>
      ${t.desc ? `<div><span>Descuento (${pct(t.pctDesc)})</span><span class="num">− ${pesos(t.desc)}</span></div>` : ''}
      <div class="tk-total"><span>Total</span><span class="num">${pesos(t.tot)}</span></div><small class="muted">Precios con IVA incluido</small></div>
    ${CARRO.modo === 'pres' ? `<button class="btn btn-naranja btn-grande tk-cobrar" onclick="guardarComoPresupuesto()">${ico('presupuesto')} Guardar presupuesto</button>
    <button class="btn btn-linea btn-sm tk-pres" onclick="CARRO.modo='';cobrar()">${ico('vender')} Cobrar como venta</button>`
    : `<button class="btn btn-naranja btn-grande tk-cobrar" onclick="cobrar()">Cobrar ${pesos(t.tot)}</button>
    <button class="btn btn-linea btn-sm tk-pres" onclick="guardarComoPresupuesto()">${ico('presupuesto')} Guardar como presupuesto</button>`}` : ''}`;
  const b = $('#pos-barra');
  if (b) b.innerHTML = CARRO.it.length ? `<span>${CARRO.it.length} producto${CARRO.it.length > 1 ? 's' : ''}<b class="num">${pesos(t.tot)}</b></span>${CARRO.modo === 'pres' ? '<button class="btn btn-naranja" onclick="guardarComoPresupuesto()">Guardar presupuesto</button>' : '<button class="btn btn-naranja" onclick="cobrar()">Cobrar</button>'}` : '';
  if (b) b.classList.toggle('hidden', !CARRO.it.length);
}

let _ventaAbierta = false;

/* ---------- Cerrar la venta ---------- */
let CIERRE = {};
function cobrar(){
  if (!CARRO.it.length) return;
  const t = totalesCarro();
  if (!esDueno() && t.pctDesc > D().config.topeDescFunc + .01){
    error('El descuento máximo para el funcionario es ' + D().config.topeDescFunc + ' %. Para más, lo tiene que hacer un dueño.'); return;
  }
  const c = cliente(CARRO.cli);
  if (!_ventaAbierta) CIERRE = { vend:'', pago:'', fac:'', facT: c && c.tdoc === 'RUT' ? 'e-Factura' : 'e-Ticket', facN:'', ent:'lleva', dir:c ? c.dir : '', zona:c ? c.zona : D().config.zonas[0], fEnt:hoy(), flete:D().config.fleteBase, nota:'' };
  _ventaAbierta = true;
  const op = (grupo, val, txt, sub) => `<button type="button" class="opcion ${CIERRE[grupo] === val ? 'on' : ''}" onclick="opCierre('${grupo}','${val}')">${txt}${sub ? `<small>${sub}</small>` : ''}</button>`;
  const flete = CIERRE.ent === 'envio' ? Number(CIERRE.flete) || 0 : 0;
  abrirModal({ titulo:'Cerrar la venta', sub:`${CARRO.it.length} producto${CARRO.it.length > 1 ? 's' : ''} · ${esc(c ? c.nombre : 'Consumidor final')}`, ancho:'md', foco:false,
    alCerrar: () => { _ventaAbierta = false; },
    cuerpo:`<div class="cierre">
      <div class="ci-paso"><div class="ci-t"><span>1</span>¿Quién vende?</div><div class="opciones" id="op-vend">${op('vend', 'func', 'Funcionario', USUARIOS.func.quien + ' · suma comisión')}${op('vend', 'duenos', 'Dueños', 'No suma comisión')}</div></div>
      <div class="ci-paso"><div class="ci-t"><span>2</span>Forma de pago</div><div class="opciones" id="op-pago">${FORMAS_PAGO.map(f => op('pago', f, f, f === 'Cuenta corriente' ? (c && c.limite ? 'Saldo ' + pesos(saldoCliente(c.id)) : 'Elegir cliente') : '')).join('')}</div></div>
      <div class="ci-paso"><div class="ci-t"><span>3</span>¿Se facturó?</div><div class="opciones" id="op-fac">${op('fac', 'si', 'Sí, ya está facturada')}${op('fac', 'no', 'No, todavía', 'Queda «Pendiente de factura»')}</div>
        ${CIERRE.fac === 'si' ? `<div class="form mt-s">${campo('Tipo', sel('facT', ['e-Ticket', 'e-Factura'], CIERRE.facT, 'onchange="CIERRE.facT=this.value"'))}${campo('Número', inp('facN', CIERRE.facN, 'text', 'placeholder="Ej.: A 40999" oninput="CIERRE.facN=this.value"'), { req:true })}</div>` : ''}</div>
      <div class="ci-paso"><div class="ci-t"><span>4</span>¿Cómo se lleva?</div><div class="opciones">${op('ent', 'lleva', 'Se lo lleva ahora', 'Descuenta el stock')}${op('ent', 'envio', 'Con envío', 'Queda reservado hasta entregar')}${op('ent', 'acopio', 'Acopio', 'Paga ahora, retira de a poco')}</div>
        ${CIERRE.ent === 'envio' ? `<div class="form mt-s">
          ${campo('Dirección', inp('dir', CIERRE.dir, 'text', 'oninput="CIERRE.dir=this.value"'), { ancho:true, req:true })}
          ${campo('Zona', sel('zona', D().config.zonas, CIERRE.zona, 'onchange="CIERRE.zona=this.value"'))}
          ${campo('Fecha de entrega', inp('fEnt', CIERRE.fEnt, 'date', 'onchange="CIERRE.fEnt=this.value"'))}
          ${campo('Costo del flete', inp('flete', CIERRE.flete, 'number', 'oninput="CIERRE.flete=this.value;totalCierre()"'), { ayuda:'Se suma al total' })}
          ${campo('Nota para el chofer', inp('nota', CIERRE.nota, 'text', 'placeholder="Ej.: llamar antes" oninput="CIERRE.nota=this.value"'))}</div>` : ''}
        ${CIERRE.ent === 'acopio' ? `<div class="caja-info mt-s">${ico('acopio')}<span>La mercadería queda pagada y <b>reservada</b> a nombre del cliente. Cada vez que retira, se descuenta del stock desde <b>Vender → Acopios</b>.</span></div>` : ''}</div>
      <div class="ci-total"><span>Total a cobrar</span><b class="num" id="ci-total">${pesos(t.tot + flete)}</b></div>
    </div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Volver</button><button class="btn btn-naranja" onclick="confirmarVenta()">${ico('ok')} Confirmar venta</button>` });
}
function opCierre(g, v){ CIERRE[g] = v; const y = $('#modal').scrollTop, y2 = $('#modal-caja').scrollTop; cobrar(); $('#modal').scrollTop = y; $('#modal-caja').scrollTop = y2; }
function totalCierre(){ const el = $('#ci-total'); if (el) el.textContent = pesos(totalesCarro().tot + (CIERRE.ent === 'envio' ? Number(CIERRE.flete) || 0 : 0)); }

async function confirmarVenta(){
  const c = cliente(CARRO.cli), t = totalesCarro();
  const falta = g => { const el = $('#op-' + g); if (el) $$('.opcion', el).forEach(o => { o.classList.remove('falta'); void o.offsetWidth; o.classList.add('falta'); }); };
  if (!CIERRE.vend){ falta('vend'); error('Falta indicar quién vende'); return; }
  if (!CIERRE.pago){ falta('pago'); error('Falta la forma de pago'); return; }
  if (!CIERRE.fac){ falta('fac'); error('Falta indicar si se facturó'); return; }
  if (CIERRE.fac === 'si' && !CIERRE.facN.trim()){ error('Escribí el número de factura (o marcá «No, todavía»)'); return; }
  if ((CIERRE.pago === 'Cuenta corriente' || CIERRE.ent === 'acopio') && !c){ error(CIERRE.pago === 'Cuenta corriente' ? 'La cuenta corriente necesita un cliente' : 'El acopio necesita un cliente'); elegirClienteVenta(); return; }
  if (CIERRE.pago === 'Cuenta corriente' && !(c.limite > 0)){ error(esc(c.nombre) + ' no tiene cuenta corriente habilitada (límite en su ficha)'); return; }
  if (CIERRE.ent === 'envio' && !CIERRE.dir.trim()){ error('Falta la dirección de entrega'); return; }
  const flete = CIERRE.ent === 'envio' ? Number(CIERRE.flete) || 0 : 0, tot = t.tot + flete;
  // Más de lo disponible: pedir confirmación explícita
  const pasan = CARRO.it.filter(i => i.c > disponibleDe(producto(i.p)));
  if (pasan.length){
    const ok = await confirmar('Hay productos sin stock suficiente', `<p>Vas a vender más de lo que hay disponible:</p><ul class="lista-simple">${pasan.map(i => { const p = producto(i.p); return `<li><b>${esc(p.nombre)}</b>: vendés ${cant(i.c)}, hay ${cant(Math.max(0, disponibleDe(p)))} ${unidadCorta(p)}</li>`; }).join('')}</ul><p class="mt-s">El stock va a quedar en negativo hasta que entre mercadería. ¿Confirmás igual?</p>`, 'Sí, vender igual', true);
    if (!ok) return;
  }
  if (CIERRE.pago === 'Cuenta corriente' && saldoCliente(c.id) + tot > c.limite){
    const ok = await confirmar('Supera el límite de crédito', `Con esta venta, <b>${esc(c.nombre)}</b> queda con un saldo de <b>${pesos(saldoCliente(c.id) + tot)}</b> y su límite es de ${pesos(c.limite)}. ¿Confirmás igual?`, 'Sí, confirmar', true);
    if (!ok) return;
  }
  const v = { id:Store.id('v'), num:nuevoNumero('venta'), f:hoy(), h:hora(), vend:CIERRE.vend, u:usuarioTxt(), cli:c ? c.id : null,
    it: CARRO.it.map(i => { const p = producto(i.p); return { p:i.p, n:p.nombre, c:i.c, pr:i.pr, co:p.costo, e:0, d:0 }; }),
    sub:t.sub, desc:t.desc, fl:flete, tot, pago:CIERRE.pago, fac: CIERRE.fac === 'si' ? { t:CIERRE.facT, n:CIERRE.facN.trim() } : null,
    est:'ok', devs:[], ent: CIERRE.ent === 'envio' ? { dir:CIERRE.dir.trim(), zona:CIERRE.zona, f:CIERRE.fEnt || hoy(), flete, nota:CIERRE.nota, est:'pendiente' } : null,
    aco: CIERRE.ent === 'acopio', ret:[], pre:CARRO.pre };
  // En el mismo paso: se lleva ahora → sale del stock; envío o acopio → queda reservado
  if (CIERRE.ent === 'lleva') v.it.forEach(i => { sacarStock(i.p, i.c, 'venta', 'Venta Nº ' + v.num); i.e = i.c; });
  D().ventas.push(v);
  if (CARRO.pre){ const pp = D().presupuestos.find(x => x.id === CARRO.pre); if (pp){ pp.est = 'convertido'; pp.venta = v.id; } }
  registrar(`Registró la venta Nº ${v.num} por ${pesos(tot)} (${v.pago}${v.fac ? '' : ', pendiente de factura'}${v.ent ? ', con envío' : v.aco ? ', acopio' : ''})`);
  guardar();
  _ventaAbierta = false; cerrarModal();
  vaciarCarro(true); _qPos = '';
  pintarNav(); RENDER.vender();
  mostrarVentaHecha(v);
}
function mostrarVentaHecha(v){
  abrirModal({ titulo:'Venta registrada', sub:'Nº ' + v.num + ' · ' + v.h, ancho:'modal-sm', foco:false,
    cuerpo:`<div class="hecha">${ico('ok')}<b class="num">${pesos(v.tot)}</b><span>${v.pago} · ${vendedorTxt(v)}</span>
      ${v.fac ? `<span class="chip c-verde">${esc(v.fac.t)} ${esc(v.fac.n)}</span>` : '<span class="chip chip-fac">Pendiente de factura</span>'}
      <small class="muted">${v.ent ? 'Queda reservado para la entrega del ' + fMedia(v.ent.f) + '.' : v.aco ? 'Queda en acopio a nombre de ' + esc(nombreCli(v.cli)) + '.' : 'El stock ya se descontó.'}</small></div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal(); fichaVenta('${v.id}')">Ver la venta</button><button class="btn btn-naranja" onclick="cerrarModal(); nuevaVenta()">${ico('mas')} Otra venta</button>` });
}

/* =====================================================================
   VENTAS · lista con filtros, ficha, factura, devolución y anulación
   ===================================================================== */
const EST_VENTAS = { periodo:'mes', estado:'todas', vend:'', pago:'', q:'', ver:60 };
const PERIODOS = [['hoy', 'Hoy'], ['7', 'Últimos 7 días'], ['mes', 'Este mes'], ['mesant', 'Mes pasado'], ['todo', 'Todo']];
function rangoPeriodo(p){
  const h = hoy();
  if (p === 'hoy') return [h, h];
  if (p === '7') return [sumarDias(h, -6), h];
  if (p === 'mes') return [inicioMes(h), h];
  if (p === 'mesant'){ const i = sumarMeses(inicioMes(h), -1); return [i, finMes(i)]; }
  return ['0000-00-00', '9999-12-31'];
}
function verVentas(filtro){
  EST_VENDER.tab = 'ventas'; EST_VENTAS.ver = 60;
  if (filtro === 'hoy'){ EST_VENTAS.periodo = 'hoy'; EST_VENTAS.estado = 'todas'; }
  if (filtro === 'pendiente'){ EST_VENTAS.periodo = 'todo'; EST_VENTAS.estado = 'pendiente'; }
  if (seccionActual !== 'vender') ir('vender'); else RENDER.vender();
}
function ventasFiltradas(){
  const e = EST_VENTAS, [a, b] = rangoPeriodo(e.periodo), q = sinTildes(e.q);
  return D().ventas.filter(v => v.f >= a && v.f <= b
    && (e.estado === 'todas' || (e.estado === 'facturada' && ventaActiva(v) && v.fac) || (e.estado === 'pendiente' && pendienteFactura(v))
        || (e.estado === 'anulada' && !ventaActiva(v)) || (e.estado === 'devolucion' && v.devs.length))
    && (!e.vend || v.vend === e.vend) && (!e.pago || v.pago === e.pago)
    && (!q || sinTildes(nombreCli(v.cli) + ' ' + v.num + ' ' + (v.fac ? v.fac.n : '') + ' ' + v.it.map(i => i.n).join(' ')).includes(q)))
    .sort((x, y) => (y.f + y.h).localeCompare(x.f + x.h));
}

function filtroVentasEstado(v){ EST_VENTAS.estado = v; EST_VENTAS.ver = 60; pintarListaVentas(); }

/* ---------- Ficha de la venta ---------- */
function fichaVenta(id){
  const v = venta(id); if (!v) return;
  const f = factorDesc(v), activa = ventaActiva(v), dueno = esDueno();
  const filas = v.it.map(i => { const p = producto(i.p), pend = r2(i.c - i.e);
    return `<tr><td><span class="p-nombre">${esc(i.n)}</span><span class="p-cod">${p ? p.cod : ''}${pend > 0 && activa ? ` · <b class="am">${cant(pend)} sin entregar</b>` : ''}${i.d ? ` · <b class="neg">${cant(i.d)} devuelto</b>` : ''}</span></td>
      <td class="derecha num">${cant(i.c)} ${p ? unidadCorta(p) : ''}</td><td class="derecha num">${pesos(i.pr)}</td><td class="derecha num">${pesos(i.c * i.pr)}</td></tr>`; }).join('');
  const lineas = [['Subtotal', pesos(v.sub)]];
  if (v.desc) lineas.push(['Descuento (' + pct(v.desc / v.sub * 100) + ')', '− ' + pesos(v.desc)]);
  if (v.fl) lineas.push(['Flete', pesos(v.fl)]);
  lineas.push(['<b>Total</b>', '<b>' + pesos(v.tot) + '</b>']);
  if (v.devs.length) lineas.push(['Devuelto', '− ' + pesos(montoDevuelto(v))], ['<b>Neto</b>', '<b>' + pesos(netoVenta(v)) + '</b>']);
  const com = v.vend === 'func' && activa ? comisionVenta(v) : null;
  abrirModal({ titulo:'Venta Nº ' + v.num, sub:`${fLarga(v.f)} · ${v.h} · registrada por ${esc(v.u)}`, ancho:'md', foco:false,
    cuerpo:`<div class="fila">${chipsVenta(v)}</div>
      <div class="datos mt-s">
        <div><small>Cliente</small><b>${v.cli ? `<a class="link" onclick="fichaCliente('${v.cli}')">${esc(nombreCli(v.cli))}</a>` : 'Consumidor final'}</b></div>
        <div><small>Vendió</small><b>${vendedorTxt(v)}</b></div>
        <div><small>Forma de pago</small><b>${v.pago}${v.pago === 'Cuenta corriente' ? (ventaCobrada(v) ? ' · cobrada' : ' · sin cobrar') : ''}</b></div>
        <div><small>Factura</small><b>${v.fac ? esc(v.fac.t + ' ' + v.fac.n) : '<span class="am">Pendiente</span>'}</b></div>
        ${com && dueno ? `<div><small>Comisión del funcionario</small><b>${pesos(com.com)}${ventasLiquidadas().has(v.id) ? ' · liquidada' : ''}</b></div>` : ''}
      </div>
      <div class="tabla-caja mt-s"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Cant.</th><th class="derecha">Precio</th><th class="derecha">Importe</th></tr></thead>
        <tbody>${filas}</tbody><tfoot>${lineas.map(([a, b]) => `<tr><td colspan="3" class="derecha">${a}</td><td class="derecha num">${b}</td></tr>`).join('')}</tfoot></table></div>
      ${v.ent ? `<div class="caja-info mt-s">${ico('camion')}<span><b>Entrega ${ESTADOS_ENTREGA[v.ent.est].t.toLowerCase()}</b> · ${fLarga(v.ent.f)} · ${esc(v.ent.dir)} (${esc(v.ent.zona)})${v.ent.nota ? ' · ' + esc(v.ent.nota) : ''}
        <br><a class="link" onclick="fichaEntrega('${v.id}')">Ver la entrega</a></span></div>` : ''}
      ${v.aco ? `<div class="caja-info mt-s">${ico('acopio')}<span><b>Acopio:</b> ${v.ret.length} retiro${v.ret.length === 1 ? '' : 's'}. Pendiente de retirar: <b>${pesos(pendienteAcopio(v))}</b></span></div>` : ''}
      ${v.devs.map(d => `<div class="caja-info aviso-am mt-s">${ico('volver')}<span><b>Devolución del ${fMedia(d.f)}</b> por ${pesos(d.monto)} · ${d.it.map(x => cant(x.c) + ' × ' + esc((producto(x.p) || {}).nombre)).join(', ')} · Motivo: ${esc(d.m)} · ${esc(d.u)}</span></div>`).join('')}
      ${v.anul ? `<div class="caja-info alerta mt-s">${ico('anular')}<span><b>Anulada el ${fMedia(v.anul.f)}</b> por ${esc(v.anul.u)}. Motivo: ${esc(v.anul.m)}. El stock volvió.</span></div>` : ''}`,
    pie: activa ? `${dueno ? `<button class="btn btn-peligro izq" onclick="anularVenta('${v.id}')">${ico('anular')} Anular</button>` : ''}
      ${v.it.some(i => i.e - i.d > 0) ? `<button class="btn btn-linea" onclick="formDevolucion('${v.id}')">${ico('volver')} Registrar devolución</button>` : ''}
      ${v.fac ? `<button class="btn btn-linea" onclick="formFactura('${v.id}')">${ico('editar')} Corregir factura</button>` : `<button class="btn btn-azul" onclick="formFactura('${v.id}')">${ico('factura')} Cargar factura</button>`}`
      : `<button class="btn btn-linea" onclick="cerrarModal()">Cerrar</button>` });
}

function formFactura(id){
  const v = venta(id), c = cliente(v.cli);
  abrirModal({ titulo:'Cargar factura', sub:'Venta Nº ' + v.num + ' · ' + pesos(netoVenta(v)), ancho:'modal-sm',
    cuerpo:`<div class="form">${campo('Tipo', sel('t', ['e-Ticket', 'e-Factura'], v.fac ? v.fac.t : (c && c.tdoc === 'RUT' ? 'e-Factura' : 'e-Ticket')))}
      ${campo('Número', inp('n', v.fac ? v.fac.n : '', 'text', 'placeholder="Ej.: A 40999"'), { req:true })}</div>`,
    pie:`<button class="btn btn-linea" onclick="fichaVenta('${id}')">Volver</button><button class="btn btn-azul" onclick="guardarFactura('${id}')">Guardar</button>` });
}
function guardarFactura(id){
  const v = venta(id), o = leerForm($('#modal-cuerpo'));
  if (!o.n){ error('Escribí el número de la factura'); return; }
  v.fac = { t:o.t, n:o.n };
  registrar(`Cargó la factura ${o.t} ${o.n} de la venta Nº ${v.num}`);
