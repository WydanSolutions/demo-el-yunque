}

/* ---------- Devolución: la mercadería vuelve al stock y se descuenta de la comisión ---------- */
function formDevolucion(id){
  const v = venta(id), f = factorDesc(v);
  const filas = v.it.filter(i => i.e - i.d > 0).map(i => { const p = producto(i.p);
    return `<tr><td><span class="p-nombre">${esc(i.n)}</span><span class="p-cod">Se llevó ${cant(i.e - i.d)} ${unidadCorta(p)} · ${pesos(i.pr * f)} c/u</span></td>
      <td class="derecha"><input class="mini" name="dv_${i.p}" type="number" min="0" max="${i.e - i.d}" step="${pasoDe(p)}" value="0" oninput="totalDevolucion('${id}')"></td></tr>`; }).join('');
  abrirModal({ titulo:'Registrar devolución', sub:'Venta Nº ' + v.num + ' · ' + esc(nombreCli(v.cli)), ancho:'md',
    cuerpo:`<p class="t2">Indicá cuánto devuelve de cada producto (puede ser parcial o total). La mercadería vuelve al stock.</p>
      <div class="tabla-caja mt-s"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Devuelve</th></tr></thead><tbody>${filas}</tbody></table></div>
      <div class="form mt">${campo('Motivo', sel('motivo', ['No era la medida', 'Le sobró', 'Falla de fábrica', 'Se equivocó de producto', 'Otro']), { req:true })}
      ${campo('Se le devuelve', `<div class="dev-total num" id="dev-total">$ 0</div>`, { ayuda: v.pago === 'Cuenta corriente' ? 'Se descuenta de su cuenta corriente' : 'Por ' + v.pago.toLowerCase() })}</div>
      ${v.vend === 'func' && ventasLiquidadas().has(v.id) ? `<div class="caja-info aviso-am mt-s">${ico('info')}<span>Esta venta ya estaba en una liquidación de comisiones: la diferencia se descuenta en la próxima.</span></div>` : ''}`,
    pie:`<button class="btn btn-linea" onclick="fichaVenta('${id}')">Volver</button><button class="btn btn-azul" onclick="guardarDevolucion('${id}')">${ico('volver')} Confirmar devolución</button>` });
}
function leerDevolucion(v){
  const f = factorDesc(v), it = []; let monto = 0;
  v.it.forEach(i => { const el = $(`[name="dv_${i.p}"]`); if (!el) return; const q = Math.min(Number(el.value) || 0, r2(i.e - i.d)); if (q > 0){ it.push({ p:i.p, c:r2(q) }); monto += q * i.pr * f; } });
  return { it, monto:Math.round(monto) };
}
function totalDevolucion(id){ $('#dev-total').textContent = pesos(leerDevolucion(venta(id)).monto); }
function guardarDevolucion(id){
  const v = venta(id), { it, monto } = leerDevolucion(v), motivo = $('[name="motivo"]').value;
  if (!it.length){ error('Indicá la cantidad que devuelve'); return; }
  const comAntes = comisionVenta(v).com, liquidada = ventasLiquidadas().has(v.id);
  it.forEach(x => { const i = v.it.find(y => y.p === x.p); i.d = r2(i.d + x.c); entrarStock(x.p, x.c, 'devolucion', 'Devolución · venta Nº ' + v.num); });
  v.devs.push({ f:hoy(), it, monto, m:motivo, u:usuarioTxt() });
  if (v.vend === 'func' && liquidada){ const dif = comisionVenta(v).com - comAntes; if (dif) D().comAjustes.push({ id:Store.id('ca'), f:hoy(), venta:v.id, monto:Math.round(dif), nota:'Devolución venta Nº ' + v.num }); }
  registrar(`Registró una devolución de ${pesos(monto)} en la venta Nº ${v.num} (${motivo})`);
  guardar(); avisar('Devolución registrada: la mercadería volvió al stock', 'volver'); fichaVenta(id); refrescar();
}

/* ---------- Anular (solo dueños) ---------- */
function anularVenta(id){
  if (!esDueno()) return;
  const v = venta(id);
  abrirModal({ titulo:'Anular la venta Nº ' + v.num, sub:pesos(netoVenta(v)) + ' · ' + esc(nombreCli(v.cli)), ancho:'modal-sm',
    cuerpo:`<div class="caja-info alerta">${ico('alerta')}<span>La venta queda anulada (no se borra) y <b>el stock vuelve</b>. Queda registrado quién la anuló y por qué.</span></div>
      <div class="form mt">${campo('Motivo', inp('m', '', 'text', 'placeholder="Ej.: error en la carga"'), { ancho:true, req:true })}</div>`,
    pie:`<button class="btn btn-linea" onclick="fichaVenta('${id}')">Volver</button><button class="btn btn-peligro" onclick="confirmarAnulacion('${id}')">${ico('anular')} Anular venta</button>` });
}
function confirmarAnulacion(id){
  const v = venta(id), m = $('[name="m"]').value.trim();
  if (!m){ error('El motivo es obligatorio'); return; }
  const com = comisionVenta(v).com, liquidada = ventasLiquidadas().has(v.id);
  v.it.forEach(i => { const q = r2(i.e - i.d); if (q > 0) entrarStock(i.p, q, 'anulacion', 'Anulación · venta Nº ' + v.num); });
  v.est = 'anulada'; v.anul = { f:hoy(), m, u:usuarioTxt() };
  if (v.vend === 'func' && liquidada && com) D().comAjustes.push({ id:Store.id('ca'), f:hoy(), venta:v.id, monto:-Math.round(com), nota:'Anulación venta Nº ' + v.num });
  if (v.pre){ const pp = D().presupuestos.find(x => x.id === v.pre); if (pp){ pp.est = 'abierto'; pp.venta = null; } }
  registrar(`Anuló la venta Nº ${v.num} por ${pesos(v.tot)}. Motivo: ${m}`);
  guardar(); avisar('Venta Nº ' + v.num + ' anulada. El stock volvió.', 'anular'); fichaVenta(id); refrescar();
}


/* ===== js/10-presupuestos.js ===== */
/* =====================================================================
   PRESUPUESTOS (no descuentan stock hasta convertirse en venta)
   y ACOPIOS (el cliente paga y retira de a poco)
   ===================================================================== */
function estadoPresupuesto(p){ return p.est === 'convertido' ? 'convertido' : (difDias(p.f, hoy()) > p.val ? 'vencido' : 'abierto'); }
const ESTADOS_PRES = { abierto:{ t:'Vigente', c:'c-azul' }, vencido:{ t:'Vencido', c:'c-gris' }, convertido:{ t:'Convertido en venta', c:'c-verde' } };
const nombrePres = p => p.cli ? nombreCli(p.cli) : (p.nom || 'Sin nombre');

function nuevoPresupuesto(){
  if (CARRO.it.length && CARRO.modo !== 'pres'){ CARRO.modo = 'pres'; }
  else if (!CARRO.it.length) CARRO = { it:[], cli:null, descTipo:'%', descVal:0, pre:null, modo:'pres' };
  EST_VENDER.tab = 'mostrador';
  if (seccionActual !== 'vender') ir('vender'); else RENDER.vender();
  avisar('Armá el presupuesto igual que una venta. No descuenta stock.', 'presupuesto');
}
function guardarComoPresupuesto(){
  if (!CARRO.it.length) return;
  const c = cliente(CARRO.cli), t = totalesCarro();
  abrirModal({ titulo:'Guardar presupuesto', sub:`${CARRO.it.length} producto${CARRO.it.length > 1 ? 's' : ''} · ${pesos(t.tot)}`, ancho:'modal-sm',
    cuerpo:`<div class="form">${c ? `<div class="ancho caja-info">${ico('clientes')}<span>Para <b>${esc(c.nombre)}</b></span></div>` :
      campo('Nombre de quien lo pide', inp('nom', '', 'text', 'placeholder="Ej.: Rosa Viera"'), { ancho:true }) + campo('Teléfono (para WhatsApp)', inp('tel', '', 'tel'), { ancho:true })}
      ${campo('Válido por (días)', inp('val', D().config.validezPresupuesto, 'number'))}</div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Volver</button><button class="btn btn-azul" onclick="confirmarPresupuesto()">${ico('ok')} Guardar</button>` });
}
function confirmarPresupuesto(){
  const o = leerForm($('#modal-cuerpo')), t = totalesCarro();
  const p = { id:Store.id('pp'), num:nuevoNumero('presupuesto'), f:hoy(), cli:CARRO.cli, nom:o.nom || '', tel:o.tel || '',
    it:CARRO.it.map(i => ({ p:i.p, n:i.n, c:i.c, pr:i.pr })), sub:t.sub, desc:t.desc, tot:t.tot, val:Number(o.val) || D().config.validezPresupuesto, est:'abierto', venta:null, u:usuarioTxt() };
  D().presupuestos.push(p);
  registrar(`Hizo el presupuesto Nº ${p.num} por ${pesos(p.tot)} para ${nombrePres(p)}`);
  guardar(); vaciarCarro(true); cerrarModal(); RENDER.vender();
  fichaPresupuesto(p.id);
}
function pintarPresupuestos(){
  const lista = D().presupuestos.slice().sort((a, b) => b.num - a.num);
  $('#vender-cuerpo').innerHTML = `<div class="tabla-caja"><div class="tabla-scroll"><table class="tabla">
    <thead><tr><th>Nº</th><th>Fecha</th><th>Para</th><th>Productos</th><th>Estado</th><th class="derecha">Total</th></tr></thead>
    <tbody>${lista.map(p => { const e = estadoPresupuesto(p); return `<tr class="clic" onclick="fichaPresupuesto('${p.id}')"><td class="fuerte num">${p.num}</td><td>${fMedia(p.f)}</td>
      <td>${esc(nombrePres(p))}</td><td class="t2">${p.it.length}</td><td><span class="chip ${ESTADOS_PRES[e].c}">${ESTADOS_PRES[e].t}</span></td><td class="derecha num fuerte">${pesos(p.tot)}</td></tr>`; }).join('')}</tbody></table></div>
    ${lista.length ? '' : vacio('Todavía no hay presupuestos.')}</div>`;
}
function fichaPresupuesto(id){
  const p = D().presupuestos.find(x => x.id === id), e = estadoPresupuesto(p);
  abrirModal({ titulo:'Presupuesto Nº ' + p.num, sub:`${fLarga(p.f)} · para ${esc(nombrePres(p))} · válido ${p.val} días`, ancho:'md', foco:false,
    cuerpo:`<span class="chip ${ESTADOS_PRES[e].c}">${ESTADOS_PRES[e].t}</span>
      <div class="tabla-caja mt-s"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Cant.</th><th class="derecha">Precio</th><th class="derecha">Importe</th></tr></thead>
      <tbody>${p.it.map(i => { const pr = producto(i.p); return `<tr><td>${esc(i.n)}${pr && pr.precio !== i.pr ? `<span class="p-cod">Hoy vale ${pesos(pr.precio)}</span>` : ''}</td><td class="derecha num">${cant(i.c)} ${pr ? unidadCorta(pr) : ''}</td><td class="derecha num">${pesos(i.pr)}</td><td class="derecha num">${pesos(i.c * i.pr)}</td></tr>`; }).join('')}</tbody>
      <tfoot>${p.desc ? `<tr><td colspan="3" class="derecha">Descuento</td><td class="derecha num">− ${pesos(p.desc)}</td></tr>` : ''}<tr><td colspan="3" class="derecha">Total (IVA incluido)</td><td class="derecha num">${pesos(p.tot)}</td></tr></tfoot></table></div>
      ${p.venta ? `<div class="caja-info ok mt-s">${ico('ok')}<span>Se convirtió en la <a class="link" onclick="fichaVenta('${p.venta}')">venta Nº ${venta(p.venta) ? venta(p.venta).num : ''}</a>.</span></div>` : ''}`,
    pie:`<button class="btn btn-linea" onclick="imprimirPresupuesto('${p.id}')">${ico('imprimir')} Imprimir</button>
      <button class="btn btn-wa" onclick="presupuestoWhatsApp('${p.id}')">${ico('wa')} WhatsApp</button>
      ${e !== 'convertido' ? `<button class="btn btn-naranja" onclick="convertirPresupuesto('${p.id}')">${ico('vender')} Convertir en venta</button>` : ''}` });
}
function presupuestoWhatsApp(id){
  const p = D().presupuestos.find(x => x.id === id), c = cliente(p.cli);
  const lista = p.it.map(i => `• ${cant(i.c)} × ${i.n}: ${pesos(i.c * i.pr)}`).join('\n');
  abrirWhatsApp(c ? c.tel : p.tel, textoMensaje(D().config.mensajes.presupuesto, { nombre:primerNombre(nombrePres(p)), numero:p.num, lista, total:pesos(p.tot), validez:p.val }));
}
async function convertirPresupuesto(id){
  const p = D().presupuestos.find(x => x.id === id);
  if (CARRO.it.length && !(await confirmar('Hay una venta sin terminar', 'Se va a reemplazar por los productos del presupuesto.', 'Reemplazar'))) return;
  CARRO = { it:p.it.map(i => ({ p:i.p, n:i.n, c:i.c, pr:i.pr })), cli:p.cli, descTipo:'$', descVal:p.desc, pre:p.id };

/* ---------- Acopios ---------- */
function pendienteAcopio(v){ const f = factorDesc(v); return v.it.reduce((s, i) => s + Math.max(0, i.c - i.e) * i.pr * f, 0); }
function pintarAcopios(){
  const lista = D().ventas.filter(v => v.aco && ventaActiva(v)).sort((a, b) => pendienteEntrega(b) - pendienteEntrega(a) || b.f.localeCompare(a.f));
  const porCli = {}; lista.filter(pendienteEntrega).forEach(v => porCli[v.cli] = (porCli[v.cli] || 0) + pendienteAcopio(v));
  const totPend = Object.values(porCli).reduce((a, b) => a + b, 0);
  $('#vender-cuerpo').innerHTML = `<div class="caja-info">${ico('acopio')}<span>El cliente paga los materiales y los retira de a poco. Lo que no retiró queda <b>reservado</b>: no se puede vender a otro.
      Hoy hay <b>${pesos(totPend)}</b> pagados y sin retirar${Object.keys(porCli).length ? ' de ' + Object.keys(porCli).length + ' cliente' + (Object.keys(porCli).length > 1 ? 's' : '') : ''}.</span></div>
    <div class="grid g-2 mt">${lista.map(v => { const pend = pendienteAcopio(v), f = factorDesc(v);
      return `<div class="card">
        <div class="card-cab"><div class="card-t">${esc(nombreCli(v.cli))}<small>Venta Nº ${v.num} · ${fMedia(v.f)} · pagó ${pesos(v.tot)}</small></div>
          ${pend > 0 ? `<span class="chip c-amarillo">Falta retirar ${pesos(pend)}</span>` : '<span class="chip c-verde">Retirado todo</span>'}</div>
        ${v.it.map(i => { const p = producto(i.p), por = i.c ? Math.round(i.e / i.c * 100) : 100;
          return `<div class="aco-it"><div class="fila-fin"><span>${esc(i.n)}</span><span class="num t2">${cant(i.e)} de ${cant(i.c)} ${unidadCorta(p)}</span></div>
            <div class="avance"><span style="width:${por}%"></span></div></div>`; }).join('')}
        <div class="fila-fin mt-s"><small class="muted">${v.ret.length} retiro${v.ret.length === 1 ? '' : 's'}${v.ret.length ? ' · último ' + fMedia(v.ret[v.ret.length - 1].f) : ''}</small>
          ${pend > 0 ? `<button class="btn btn-azul btn-sm" onclick="formRetiro('${v.id}')">${ico('acopio')} Registrar retiro</button>` : ''}</div></div>`; }).join('')}</div>
    ${lista.length ? '' : vacio('No hay acopios. Se crean al cerrar una venta eligiendo «Acopio».')}`;
}
function formRetiro(id){
  const v = venta(id);
  abrirModal({ titulo:'Registrar retiro', sub:esc(nombreCli(v.cli)) + ' · venta Nº ' + v.num, ancho:'md',
    cuerpo:`<p class="t2">¿Cuánto se lleva hoy? Se descuenta del stock y de lo reservado.</p>
      <div class="tabla-caja mt-s"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Le queda</th><th class="derecha">Retira hoy</th></tr></thead>
      <tbody>${v.it.filter(i => i.c - i.e > 0).map(i => { const p = producto(i.p);
        return `<tr><td>${esc(i.n)}</td><td class="derecha num">${cant(i.c - i.e)} ${unidadCorta(p)}</td><td class="derecha"><input class="mini" type="number" name="rt_${i.p}" min="0" max="${i.c - i.e}" step="${pasoDe(p)}" value="0"></td></tr>`; }).join('')}</tbody></table></div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Volver</button><button class="btn btn-azul" onclick="guardarRetiro('${id}')">${ico('ok')} Confirmar retiro</button>` });
}
function guardarRetiro(id){
  const v = venta(id), it = [];
  v.it.forEach(i => { const el = $(`[name="rt_${i.p}"]`); if (!el) return; const q = Math.min(Number(el.value) || 0, r2(i.c - i.e)); if (q > 0) it.push({ p:i.p, c:r2(q) }); });
  if (!it.length){ error('Indicá cuánto retira'); return; }
  it.forEach(x => { const i = v.it.find(y => y.p === x.p); i.e = r2(i.e + x.c); sacarStock(x.p, x.c, 'retiro', 'Retiro de acopio · venta Nº ' + v.num); });
  v.ret.push({ f:hoy(), it, u:usuarioTxt() });
  registrar(`Registró un retiro de acopio de ${nombreCli(v.cli)} (venta Nº ${v.num})`);
  guardar(); cerrarModal(); avisar('Retiro registrado. Se descontó del stock.'); refrescar();
}

/* =====================================================================
   STOCK · productos, ficha (lotes + historial) y alta / edición
   El funcionario consulta todo, pero NO ve costos ni márgenes.
   ===================================================================== */
const EST_STOCK = { tab:'productos', filtro:'todos', q:'', cat:'', prov:'', ver:80 };
function verStock(filtro){
  EST_STOCK.ver = 80;
  if (filtro === 'alertas') EST_STOCK.tab = 'alertas';
  else { EST_STOCK.tab = 'productos'; EST_STOCK.filtro = filtro || 'todos'; EST_STOCK.q = ''; }
  if (seccionActual !== 'stock') ir('stock'); else RENDER.stock();
}
RENDER.stock = function(){
  const t = EST_STOCK.tab, dueno = esDueno();
  const nAl = alertas().filter(a => a.sec === 'stock').reduce((s, a) => s + a.n, 0);
  const nLista = D().productos.filter(p => ['falta', 'bajo'].includes(info(p).estado)).length;
  encabezado('Stock', D().productos.length + ' productos · el stock se actualiza solo con cada venta, compra y devolución.',
    (dueno ? `<button class="btn btn-linea" onclick="formAjuste()">${ico('ajuste')} Ajustar stock</button>
      <button class="btn btn-linea" onclick="formPreciosMasivo()">${ico('porcentaje')} Actualizar precios</button>

  const tabs = [['productos', 'Productos'], ['alertas', 'Alertas', nAl, true], ['lista', 'Lista de compra', nLista], ['movimientos', 'Movimientos']];
  if (dueno) tabs.push(['inventario', 'Inventario físico']);
  $('#vista').innerHTML = pestanas(tabs, t, 'tabStock') + '<div id="stock-cuerpo"></div>';
  ({ productos:pintarProductos, alertas:pintarAlertasStock, lista:pintarListaCompra, movimientos:pintarMovimientos, inventario:pintarInventario })[t]();
};
function tabStock(t){ EST_STOCK.tab = t; EST_STOCK.ver = 80; RENDER.stock(); }

/* ---------- Lista de productos ---------- */
function productosFiltrados(){
  const e = EST_STOCK, q = sinTildes(e.q).split(/\s+/).filter(Boolean);
  return D().productos.filter(p => {
    const i = info(p);
    if (e.filtro !== 'todos' && !(e.filtro === 'normal' ? !i.estados.length : i.estados.includes(e.filtro))) return false;
    if (e.cat && p.cat !== e.cat) return false;
    if (e.prov && p.prov !== e.prov) return false;
    const t = sinTildes(p.nombre + ' ' + p.cod + ' ' + p.marca + ' ' + p.barras);
    return q.every(w => t.includes(w));
  }).sort((a, b) => a.cat.localeCompare(b.cat) || a.nombre.localeCompare(b.nombre));
}
function pintarProductos(){
  const e = EST_STOCK, dueno = esDueno(), lista = productosFiltrados();
  const cnt = k => D().productos.filter(p => k === 'normal' ? !info(p).estados.length : info(p).estados.includes(k)).length;
  const { filas, mas } = paginar(lista, e, 'EST_STOCK.ver+=100;pintarProductos()');
  const vs = valorStock();
  $('#stock-cuerpo').innerHTML = `
    ${dueno ? `<div class="banda-valor"><span>${ico('dinero')} Valor total del stock</span><span>A costo <b class="num">${pesos(vs.costo)}</b></span><span>A precio de venta <b class="num">${pesos(vs.venta)}</b></span><span class="muted">Ganancia posible ${pesos(vs.venta - vs.costo)}</span></div>` : ''}
    <div class="herr">
      ${buscador('s-q', e.q, 'Nombre, código, marca o código de barras', 'filtroStockQ')}
      <select class="sel" onchange="EST_STOCK.cat=this.value;pintarProductos()" aria-label="Categoría"><option value="">Todas las categorías</option>${D().config.categorias.map(c => `<option ${c === e.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select class="sel" onchange="EST_STOCK.prov=this.value;pintarProductos()" aria-label="Proveedor"><option value="">Todos los proveedores</option>${D().proveedores.map(p => `<option value="${p.id}" ${p.id === e.prov ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>
    </div>
    <div class="herr">${pildoras([['todos', 'Todos', D().productos.length], ['normal', 'Normal', cnt('normal')], ['bajo', 'Bajo mínimo', cnt('bajo'), 'p-amarillo'], ['falta', 'En falta', cnt('falta'), 'p-rojo'],
      ['proximo', 'Próximo a vencer', cnt('proximo'), 'p-amarillo'], ['vencido', 'Vencido', cnt('vencido'), 'p-rojo'], ['sinmov', 'Sin movimiento', cnt('sinmov')]], e.filtro, 'filtroStock')}</div>
    <div class="tabla-caja"><div class="tabla-scroll"><table class="tabla">
      <thead><tr><th>Producto</th><th>Categoría</th><th class="derecha">Stock</th><th class="derecha">Reservado</th><th class="derecha">Disponible</th><th class="derecha">Mínimo</th>
        <th class="derecha">Precio</th>${dueno ? '<th class="derecha">Costo</th><th class="derecha">Margen</th>' : ''}<th>Estado</th></tr></thead>
      <tbody>${filas.map(p => { const i = info(p), u = unidadCorta(p);
        return `<tr class="clic" onclick="fichaProducto('${p.id}')"><td><span class="p-nombre">${esc(p.nombre)}</span><span class="p-cod">${p.cod} · ${esc(p.marca)}${p.vence ? ' · por lote' : ''}</span></td>
          <td class="t2">${esc(p.cat)}</td><td class="derecha num">${cant(i.st)} <span class="muted">${u}</span></td>
          <td class="derecha num ${i.res ? 'am' : 'muted'}">${i.res ? cant(i.res) : '—'}</td>
          <td class="derecha num fuerte ${i.disp <= 0 ? 'neg' : i.disp <= p.min ? 'am' : ''}">${cant(i.disp)}</td><td class="derecha num muted">${cant(p.min)}</td>
          <td class="derecha num">${pesos(p.precio)}</td>${dueno ? `<td class="derecha num t2">${pesos(p.costo)}</td><td class="derecha num t2">${pct(margenDe(p))}</td>` : ''}
          <td>${chipsProd(p)}</td></tr>`; }).join('')}</tbody></table></div>
      ${lista.length ? '' : vacio('No hay productos con estos filtros.')}${mas}</div>`;
}
let _tSQ;
function filtroStockQ(v){ EST_STOCK.q = v; EST_STOCK.ver = 80; clearTimeout(_tSQ); _tSQ = setTimeout(() => { pintarProductos(); const i = $('#s-q'); i.focus(); i.setSelectionRange(v.length, v.length); }, 200); }
function filtroStock(v){ EST_STOCK.filtro = v; EST_STOCK.ver = 80; pintarProductos(); }
function exportarProductos(){
  const dueno = esDueno();
  const cab = ['Código', 'Código de barras', 'Producto', 'Categoría', 'Marca', 'Proveedor', 'Unidad', 'Stock', 'Reservado', 'Disponible', 'Mínimo', 'Precio'].concat(dueno ? ['Costo', 'Margen %'] : []).concat(['Estado']);
  exportarCSV('Stock', cab, productosFiltrados().map(p => { const i = info(p);
    return [p.cod, p.barras, p.nombre, p.cat, p.marca, nombreProv(p.prov), UNIDADES[p.unidad].t, numCSV(i.st), numCSV(i.res), numCSV(i.disp), numCSV(p.min), p.precio]
      .concat(dueno ? [p.costo, numCSV(margenDe(p))] : []).concat([i.estados.map(e => ESTADOS_PROD[e].t).join(', ') || 'Normal']); }));
}

/* ---------- Ficha del producto ---------- */
function fichaProducto(id){
  const p = producto(id); if (!p) return;
  const i = info(p), u = unidadCorta(p), dueno = esDueno(), h = hoy();
  const movs = D().mstock.filter(m => m.p === id).slice(0, 40);
  const lotes = p.vence ? lotesOrdenados(p).map(l => { const d = l.vence ? difDias(h, l.vence) : null;
    const chip = d == null ? '<span class="chip c-gris">Sin fecha</span>' : d < 0 ? '<span class="chip c-rojo">Vencido</span>' : d <= 30 ? `<span class="chip c-rojo">Vence ${cuando(l.vence)}</span>` : d <= D().config.diasVence ? `<span class="chip c-amarillo">Vence ${cuando(l.vence)}</span>` : '<span class="chip c-verde">Vigente</span>';
    return `<tr><td class="fuerte">${esc(l.lote)}</td><td class="derecha num">${cant(l.c)} ${u}</td><td>${l.vence ? fCorta(l.vence) : '—'}</td><td>${chip}</td></tr>`; }).join('') : '';
  abrirModal({ titulo:esc(p.nombre), sub:`${p.cod} · ${esc(p.cat)} · ${esc(p.marca)}`, ancho:'lg', foco:false,
    cuerpo:`<div class="fila">${chipsProd(p)}</div>
      <div class="stock-cajas mt-s">
        <div><small>Stock actual</small><b class="num">${cant(i.st)}</b><span>${u}</span></div>
        <div><small>Reservado</small><b class="num ${i.res ? 'am' : ''}">${cant(i.res)}</b><span>para entregas y acopios</span></div>
        <div class="dest"><small>Disponible</small><b class="num ${i.disp <= 0 ? 'neg' : ''}">${cant(i.disp)}</b><span>mínimo ${cant(p.min)}</span></div>
        <div><small>Vendido este mes</small><b class="num">${cant(i.vendMes)}</b><span>${i.ult ? 'última venta ' + cuando(i.ult) : 'sin ventas'}</span></div>
      </div>
      <div class="datos mt">
        <div><small>Precio de venta</small><b>${pesos(p.precio)} <span class="muted">/ ${u} · IVA inc.</span></b></div>
        ${dueno ? `<div><small>Costo</small><b>${pesos(p.costo)}</b></div><div><small>Margen</small><b>${pct(margenDe(p))}</b></div>` : ''}
        <div><small>Proveedor</small><b><a class="link" onclick="fichaProveedor('${p.prov}')">${esc(nombreProv(p.prov))}</a></b></div>
        <div><small>Unidad</small><b>${UNIDADES[p.unidad].t}</b></div>
        <div><small>Código de barras</small><b class="num">${p.barras || '—'}</b></div>
        <div><small>Vencimiento</small><b>${p.vence ? 'Maneja lotes' : 'No vence'}</b></div>
      </div>
      ${p.vence ? `<h3 class="sub-t mt">Lotes <small>se vende primero el que vence antes</small></h3>
        <div class="tabla-caja"><table class="tabla"><thead><tr><th>Lote</th><th class="derecha">Cantidad</th><th>Vence</th><th>Estado</th></tr></thead><tbody>${lotes}</tbody></table>${p.lotes.length ? '' : vacio('Sin lotes con stock.')}</div>` : ''}
      <h3 class="sub-t mt">Historial de movimientos</h3>
      <div class="tabla-caja"><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Fecha</th><th>Motivo</th><th>Detalle</th><th class="derecha">Cantidad</th><th>Usuario</th></tr></thead>
        <tbody>${movs.map(filaMov).join('')}</tbody></table></div>${movs.length ? '' : vacio('Todavía no tiene movimientos.')}</div>`,
    pie:`${dueno ? `<button class="btn btn-linea izq" onclick="formProducto('${id}')">${ico('editar')} Editar</button><button class="btn btn-linea" onclick="formAjuste('${id}')">${ico('ajuste')} Ajustar stock</button>` : ''}
      <button class="btn btn-naranja" onclick="cerrarModal(); agregarAlCarro('${id}'); nuevaVentaSinPreguntar()">${ico('vender')} Vender</button>` });
}
function nuevaVentaSinPreguntar(){ EST_VENDER.tab = 'mostrador'; CARRO.modo = CARRO.modo || ''; if (seccionActual !== 'vender') ir('vender'); else RENDER.vender(); }
function filaMov(m){
  const cls = m.c > 0 ? 'pos' : 'neg';
  return `<tr><td class="num">${fMedia(m.f)} <span class="muted">${m.h}</span></td><td><span class="chip sin-punto ${m.c > 0 ? 'c-verde' : 'c-gris'}">${MOTIVOS_MOV[m.m] || m.m}</span></td>
    <td class="t2">${esc(m.ref)}${m.lote ? ` <span class="muted">· lote ${esc(m.lote)}</span>` : ''}</td><td class="derecha num fuerte ${cls}">${m.c > 0 ? '+' : '−'}${cant(Math.abs(m.c))}</td><td class="t2">${esc(m.u)}</td></tr>`;
}

/* ---------- Alta / edición de producto (solo dueños) ---------- */
function formProducto(id){
  if (!esDueno()) return;
  const p = id ? producto(id) : { cod:'', barras:'', nombre:'', cat:D().config.categorias[0], marca:'', prov:D().proveedores[0].id, unidad:'unidad', costo:'', precio:'', min:'', vence:false };
  abrirModal({ titulo: id ? 'Editar producto' : 'Nuevo producto', sub: id ? p.cod : 'Los campos con * son obligatorios', ancho:'md',
    cuerpo:`<div class="form">
      ${campo('Nombre', inp('nombre', p.nombre), { ancho:true, req:true })}
      ${campo('Código', inp('cod', p.cod || siguienteCodigo(p.cat)), { req:true })}
      ${campo('Código de barras', inp('barras', p.barras, 'text', 'inputmode="numeric" placeholder="Escanealo acá"'))}
      ${campo('Categoría', sel('cat', D().config.categorias, p.cat))}
      ${campo('Marca', inp('marca', p.marca))}
      ${campo('Proveedor', sel('prov', D().proveedores.map(x => [x.id, x.nombre]), p.prov))}
      ${campo('Unidad de medida', sel('unidad', Object.keys(UNIDADES).map(k => [k, UNIDADES[k].t]), p.unidad))}
      <div class="form-sep">Precio</div>
      ${campo('Costo (IVA inc.)', inp('costo', p.costo, 'number', 'oninput="calcMargen()"'), { req:true })}
      ${campo('Precio de venta (IVA inc.)', inp('precio', p.precio, 'number', 'oninput="calcMargen()"'), { req:true })}
      ${campo('Margen', inp('margen', p.costo && p.precio ? Math.round(margenDe(p) * 10) / 10 : '', 'number', 'oninput="calcPrecio()"'), { ayuda:'Si lo cambiás, se calcula el precio' })}
      ${campo('Stock mínimo', inp('min', p.min, 'number'), { req:true })}
      ${check('vence', p.vence, 'Maneja vencimiento (por lote)', id ? 'disabled' : 'onchange="$(\'#f-lote\').classList.toggle(\'hidden\',!this.checked)"')}
      ${id ? '' : `<div class="form-sep">Stock inicial</div>
        ${campo('Cantidad que hay hoy', inp('stock', 0, 'number'))}
        <div id="f-lote" class="hidden ancho"><div class="form">${campo('Lote', inp('lote', ''))}${campo('Vence', inp('venceF', '', 'date'))}</div></div>`}
    </div>`,
    pie:`<button class="btn btn-linea" onclick="${id ? `fichaProducto('${id}')` : 'cerrarModal()'}">Volver</button><button class="btn btn-azul" onclick="guardarProducto(${id ? `'${id}'` : ''})">${ico('ok')} Guardar</button>` });
}
function calcMargen(){ const c = Number($('[name=costo]').value), p = Number($('[name=precio]').value); if (c > 0 && p > 0) $('[name=margen]').value = Math.round((p - c) / p * 1000) / 10; }
function calcPrecio(){ const c = Number($('[name=costo]').value), m = Number($('[name=margen]').value); if (c > 0 && m < 100) $('[name=precio]').value = Math.round(c / (1 - m / 100)); }
function siguienteCodigo(cat){ const pre = (cat || 'X')[0].toUpperCase(); const n = D().productos.filter(p => p.cod[0] === pre).map(p => Number(p.cod.slice(1)) || 0); return pre + p2(Math.max(0, ...n) + 1).padStart(3, '0'); }
function guardarProducto(id){
  const o = leerForm($('#modal-cuerpo'));
  if (!o.nombre || !o.cod || !(o.precio > 0) || !(o.costo > 0) || o.min === ''){ error('Completá nombre, código, costo, precio y mínimo'); return; }
  if (D().productos.some(p => p.id !== id && (p.cod.toLowerCase() === o.cod.toLowerCase() || (o.barras && p.barras === o.barras)))){ error('Ya hay otro producto con ese código o código de barras'); return; }
  let p = id && producto(id);
  const datos = { cod:o.cod, barras:o.barras, nombre:o.nombre, cat:o.cat, marca:o.marca || '—', prov:o.prov, unidad:o.unidad, costo:Number(o.costo), precio:Number(o.precio), min:Number(o.min) || 0 };
  if (p){
    const cambios = []; if (p.precio !== datos.precio) cambios.push('precio ' + pesos(p.precio) + ' → ' + pesos(datos.precio)); if (p.costo !== datos.costo) cambios.push('costo ' + pesos(p.costo) + ' → ' + pesos(datos.costo));
    Object.assign(p, datos);
    registrar(`Editó el producto ${p.cod} · ${p.nombre}${cambios.length ? ' (' + cambios.join(', ') + ')' : ''}`);
  } else {
    p = Object.assign({ id:Store.id('pr'), vence:!!o.vence, stock:0, lotes:[], alta:hoy() }, datos);
    D().productos.push(p); _cache = {};
    if (Number(o.stock) > 0) entrarStock(p.id, Number(o.stock), 'ajuste', 'Stock inicial al crear el producto', o.vence ? (o.lote || 'S/L') : '', o.venceF || '');
    registrar(`Creó el producto ${p.cod} · ${p.nombre}`);
  }
  guardar(); avisar('Producto guardado'); fichaProducto(p.id); refrescar();
}


/* ===== js/12-stock-herr.js ===== */
/* =====================================================================
   STOCK · alertas, lista de compra sugerida, movimientos,
   ajustes manuales, inventario físico y actualización masiva de precios
   ===================================================================== */

/* ---------- Alertas ---------- */
function pintarAlertasStock(){
  const dueno = esDueno(), h = hoy(), cfg = D().config;
  const P = D().productos.map(p => [p, info(p)]);
  const falta = P.filter(([p, i]) => i.estados.includes('falta')), bajo = P.filter(([p, i]) => i.estados.includes('bajo'));
  const lotes = []; D().productos.forEach(p => p.vence && p.lotes.forEach(l => { if (l.c > 0 && l.vence) lotes.push({ p, l, d:difDias(h, l.vence) }); }));
  const vencidos = lotes.filter(x => x.d < 0).sort((a, b) => a.d - b.d), prox = lotes.filter(x => x.d >= 0 && x.d <= cfg.diasVence).sort((a, b) => a.d - b.d);
  const inm = inmovilizado();
  const top = P.filter(([p, i]) => i.vendMes > 0).sort((a, b) => b[1].montoMes - a[1].montoMes).slice(0, 10);
  const fila = (p, der, extra) => `<button class="fila-lista" onclick="fichaProducto('${p.id}')"><span><span class="p-nombre">${esc(p.nombre)}</span><span class="p-cod">${p.cod}${extra ? ' · ' + extra : ''}</span></span><span class="derecha">${der}</span></button>`;
  const tarjeta = (t, sub, n, cls, cuerpo, acc) => `<div class="card alerta-card ${cls}"><div class="card-cab"><div class="card-t">${t} <span class="card-num">${n}</span><small>${sub}</small></div>${acc || ''}</div>
    ${n ? `<div class="lista">${cuerpo}</div>` : vacio('Nada por acá.')}</div>`;
  $('#stock-cuerpo').innerHTML = `<div class="grid g-2">
    ${tarjeta('En falta', 'Sin stock disponible', falta.length, 'ac-rojo', falta.map(([p, i]) => fila(p, `<b class="neg num">${cant(i.disp)} ${unidadCorta(p)}</b>`, i.res ? 'reservado ' + cant(i.res) : 'mínimo ' + cant(p.min))).join(''),
      `<button class="btn btn-linea btn-sm" onclick="tabStock('lista')">${ico('lista')} Lista de compra</button>`)}
    ${tarjeta('Bajo el mínimo', 'Todavía hay, pero poco', bajo.length, 'ac-amarillo', bajo.map(([p, i]) => fila(p, `<b class="am num">${cant(i.disp)}</b> <span class="muted">/ mín. ${cant(p.min)}</span>`, nombreProv(p.prov))).join(''))}
    ${tarjeta('Vencidos', 'Lotes que ya vencieron', vencidos.length, 'ac-rojo', vencidos.map(x => fila(x.p, `<span class="chip c-rojo">${cant(x.l.c)} ${unidadCorta(x.p)}</span>`, 'lote ' + esc(x.l.lote) + ' · venció ' + cuando(x.l.vence))).join(''),
      dueno && vencidos.length ? '<small class="muted">Sacarlos con «Ajustar stock» (motivo: pérdida)</small>' : '')}
    ${tarjeta('Próximos a vencer', 'En los próximos 30 y ' + cfg.diasVence + ' días', prox.length, 'ac-amarillo', prox.map(x => fila(x.p, `<span class="chip ${x.d <= 30 ? 'c-rojo' : 'c-amarillo'}">${x.d <= 30 ? '≤ 30 días' : '≤ ' + cfg.diasVence + ' días'}</span>`, 'lote ' + esc(x.l.lote) + ' · ' + cant(x.l.c) + ' ' + unidadCorta(x.p) + ' · vence ' + fMedia(x.l.vence))).join(''))}
    ${tarjeta('Sin ventas en ' + cfg.diasSinVentas + ' días', dueno ? 'Plata inmovilizada: <b class="t2">' + pesos(inm.monto) + '</b> (a costo)' : 'Productos que no se mueven', inm.lista.length, '',
      inm.lista.sort((a, b) => stockDe(b) * b.costo - stockDe(a) * a.costo).map(p => { const i = info(p); return fila(p, dueno ? `<b class="num">${pesos(Math.max(0, i.st) * p.costo)}</b>` : `<span class="num">${cant(i.st)} ${unidadCorta(p)}</span>`, i.ult ? 'última venta ' + cuando(i.ult) : 'nunca se vendió'); }).join(''))}
    ${tarjeta('Los más vendidos del mes', 'Por importe vendido', top.length, 'ac-azul', top.map(([p, i], k) => fila(p, `<b class="num">${pesos(i.montoMes)}</b>`, '#' + (k + 1) + ' · ' + cant(i.vendMes) + ' ' + unidadCorta(p))).join(''))}
  </div>`;
}

/* ---------- Lista de compra sugerida (por proveedor) ---------- */
function sugeridoPara(p){ const i = info(p), paso = pasoDe(p); return Math.max(paso, Math.ceil((p.min * 2 - i.disp) / paso) * paso); }
function pintarListaCompra(){
  const bajos = D().productos.filter(p => ['falta', 'bajo'].includes(info(p).estado) || info(p).disp <= p.min);
  const porProv = {}; bajos.forEach(p => (porProv[p.prov] = porProv[p.prov] || []).push(p));
  const pedidosAbiertos = D().pedidos.filter(pd => estadoPedido(pd) !== 'recibido');
  const yaPedido = pid => pedidosAbiertos.reduce((s, pd) => s + pd.it.filter(i => i.p === pid).reduce((a, i) => a + i.c - i.r, 0), 0);
  $('#stock-cuerpo').innerHTML = `<div class="caja-info">${ico('lista')}<span>Productos bajo el mínimo, agrupados por proveedor. La cantidad sugerida lleva cada producto al <b>doble del mínimo</b>; se puede cambiar antes de enviar el pedido.</span></div>
    <div class="grid g-2 mt">${Object.keys(porProv).map(pid => { const pv = proveedor(pid);
      return `<div class="card"><div class="card-cab"><div class="card-t">${esc(pv.nombre)}<small>${esc(pv.contacto)} · ${esc(pv.tel)} · entrega ${esc(pv.dias.toLowerCase())}</small></div></div>
        <table class="tabla tabla-comp"><thead><tr><th>Producto</th><th class="derecha">Disp.</th><th class="derecha">Pedir</th></tr></thead><tbody>
        ${porProv[pid].map(p => { const i = info(p), yp = yaPedido(p.id); return `<tr><td><span class="p-nombre">${esc(p.nombre)}</span><span class="p-cod">${p.cod} · mín. ${cant(p.min)}${yp ? ` · <b class="am">ya pedido ${cant(yp)}</b>` : ''}</span></td>
          <td class="derecha num ${i.disp <= 0 ? 'neg' : 'am'}">${cant(i.disp)}</td><td class="derecha"><input class="mini" type="number" id="lc_${p.id}" min="0" step="${pasoDe(p)}" value="${yp ? 0 : sugeridoPara(p)}"> <span class="muted">${unidadCorta(p)}</span></td></tr>`; }).join('')}
        </tbody></table>
        <div class="fila mt-s" style="justify-content:flex-end"><button class="btn btn-wa btn-sm" onclick="pedidoWhatsApp('${pid}')">${ico('wa')} Enviar por WhatsApp</button>
          <button class="btn btn-azul btn-sm" onclick="crearPedidoDesdeLista('${pid}')">${ico('compras')} Crear pedido</button></div></div>`; }).join('')}</div>
    ${bajos.length ? '' : vacio('No hay productos bajo el mínimo. ¡Todo en orden!')}`;
}
function leerListaCompra(pid){ return D().productos.filter(p => p.prov === pid).map(p => { const el = $('#lc_' + p.id); return el && Number(el.value) > 0 ? { p:p.id, c:r2(Number(el.value)) } : null; }).filter(Boolean); }
function pedidoWhatsApp(pid){
  const it = leerListaCompra(pid), pv = proveedor(pid);
  if (!it.length){ error('No hay cantidades para pedir'); return; }
  const lista = it.map(i => { const p = producto(i.p); return `• ${cant(i.c)} ${unidadCorta(p)} · ${p.nombre} (${p.cod})`; }).join('\n');
  abrirWhatsApp(pv.tel, textoMensaje(D().config.mensajes.pedido, { proveedor:primerNombre(pv.contacto), lista }));
}
function crearPedidoDesdeLista(pid){
  const it = leerListaCompra(pid);
  if (!it.length){ error('No hay cantidades para pedir'); return; }
  const pd = { id:Store.id('pd'), num:nuevoNumero('pedido'), prov:pid, f:hoy(), it:it.map(i => ({ p:i.p, c:i.c, r:0 })), nota:'Desde la lista de compra', u:usuarioTxt() };
  D().pedidos.push(pd);
  registrar(`Creó el pedido Nº ${pd.num} a ${nombreProv(pid)} (${it.length} productos)`);
  guardar(); avisar('Pedido Nº ' + pd.num + ' creado. Queda en Compras → Pedidos.', 'compras'); refrescar();
}

/* ---------- Movimientos (todas las entradas y salidas) ---------- */
const EST_MOV = { m:'', q:'', ver:80 };
function pintarMovimientos(){
  const q = sinTildes(EST_MOV.q);
  const lista = D().mstock.filter(m => (!EST_MOV.m || m.m === EST_MOV.m) && (!q || sinTildes((producto(m.p) || {}).nombre + ' ' + m.ref + ' ' + m.u).includes(q)));
  const { filas, mas } = paginar(lista, EST_MOV, 'EST_MOV.ver+=100;pintarMovimientos()');
  $('#stock-cuerpo').innerHTML = `<div class="herr">${buscador('m-q', EST_MOV.q, 'Producto, detalle o usuario', 'filtroMovQ')}
      <select class="sel" onchange="EST_MOV.m=this.value;EST_MOV.ver=80;pintarMovimientos()" aria-label="Motivo"><option value="">Todos los motivos</option>${Object.keys(MOTIVOS_MOV).map(k => `<option value="${k}" ${k === EST_MOV.m ? 'selected' : ''}>${MOTIVOS_MOV[k]}</option>`).join('')}</select>
      <button class="btn btn-linea" onclick="exportarMovimientos()">${ico('descargar')} Exportar a Excel</button></div>
    <div class="tabla-caja"><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Fecha</th><th>Producto</th><th>Motivo</th><th>Detalle</th><th class="derecha">Cantidad</th><th>Usuario</th></tr></thead>
      <tbody>${filas.map(m => { const p = producto(m.p) || { nombre:'(producto borrado)', cod:'' }; return filaMov(m).replace('<td><span class="chip', `<td><a class="link" onclick="fichaProducto('${m.p}')">${esc(p.nombre)}</a></td><td><span class="chip`); }).join('')}</tbody></table></div>
      ${lista.length ? '' : vacio('Sin movimientos.')}${mas}</div>`;
}
let _tMQ;
function filtroMovQ(v){ EST_MOV.q = v; clearTimeout(_tMQ); _tMQ = setTimeout(() => { pintarMovimientos(); const i = $('#m-q'); i.focus(); i.setSelectionRange(v.length, v.length); }, 220); }
function exportarMovimientos(){
  exportarCSV('Movimientos de stock', ['Fecha', 'Hora', 'Código', 'Producto', 'Motivo', 'Detalle', 'Lote', 'Cantidad', 'Usuario'],
    D().mstock.map(m => { const p = producto(m.p) || {}; return [fCorta(m.f), m.h, p.cod, p.nombre, MOTIVOS_MOV[m.m] || m.m, m.ref, m.lote, numCSV(m.c), m.u]; }));
}

/* ---------- Ajuste manual (solo dueños, motivo obligatorio) ---------- */
function formAjuste(id){
  if (!esDueno()) return;
  abrirModal({ titulo:'Ajustar stock', sub:'Rotura, pérdida, uso interno o corrección. Queda registrado.', ancho:'md',
    cuerpo:`<div class="form">
      ${campo('Producto', `<input name="prod" list="dl-prod" value="${id ? esc(producto(id).cod + ' · ' + producto(id).nombre) : ''}" placeholder="Escribí el nombre o el código" oninput="infoAjuste()">
        <datalist id="dl-prod">${D().productos.map(p => `<option value="${esc(p.cod + ' · ' + p.nombre)}">`).join('')}</datalist>`, { ancho:true, req:true })}
      <div class="ancho" id="aj-info"></div>
      ${campo('Movimiento', sel('sentido', [['-', 'Sale del stock (−)'], ['+', 'Entra al stock (+)']], '-'))}
      ${campo('Cantidad', inp('cant', '', 'number', 'min="0"'), { req:true })}
      ${campo('Motivo', sel('motivo', [['', 'Elegí el motivo…']].concat(MOTIVOS_AJUSTE.map(m => [m, m])), ''), { req:true })}
      ${campo('Detalle', inp('nota', '', 'text', 'placeholder="Ej.: se rompió al descargar"'))}
    </div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="guardarAjuste()">${ico('ok')} Confirmar ajuste</button>`,
    alAbrir: () => infoAjuste() });
}
function prodDeTexto(t){ const cod = String(t || '').split(' · ')[0].trim().toLowerCase(); return D().productos.find(p => p.cod.toLowerCase() === cod || p.barras === cod); }
function infoAjuste(){
  const p = prodDeTexto($('[name=prod]').value), caja = $('#aj-info'); if (!caja) return;
  caja.innerHTML = p ? `<div class="caja-info">${ico('stock')}<span>Stock actual de <b>${esc(p.nombre)}</b>: <b>${cant(stockDe(p))} ${unidadCorta(p)}</b> · disponible ${cant(disponibleDe(p))}${p.vence ? ' · maneja lotes (sale primero el que vence antes)' : ''}</span></div>` : '';
}
function guardarAjuste(){
  const o = leerForm($('#modal-cuerpo')), p = prodDeTexto(o.prod);
  if (!p){ error('Elegí un producto de la lista'); return; }
  if (!(o.cant > 0)){ error('Indicá la cantidad'); return; }
  if (!o.motivo){ error('El motivo es obligatorio'); return; }
  const ref = o.motivo + (o.nota ? ' · ' + o.nota : '');
  if (o.sentido === '-') sacarStock(p.id, o.cant, 'ajuste', ref); else entrarStock(p.id, o.cant, 'ajuste', ref);
  registrar(`Ajustó el stock de ${p.nombre}: ${o.sentido}${cant(o.cant)} ${unidadCorta(p)} (${ref})`);
  guardar(); cerrarModal(); avisar('Ajuste registrado'); refrescar();
}

/* ---------- Inventario físico: se carga el conteo y se ven las diferencias antes de ajustar ---------- */
const EST_INV = { cat:'', conteo:{} };
function pintarInventario(){
  const cats = D().config.categorias, e = EST_INV;
  const lista = D().productos.filter(p => !e.cat || p.cat === e.cat).sort((a, b) => a.nombre.localeCompare(b.nombre));
  let difs = 0, valor = 0;
  lista.forEach(p => { const c = e.conteo[p.id]; if (c !== undefined && c !== '' && Number(c) !== stockDe(p)){ difs++; valor += (Number(c) - stockDe(p)) * p.costo; } });
  const ult = D().inventarios[D().inventarios.length - 1];
  $('#stock-cuerpo').innerHTML = `<div class="caja-info">${ico('lista')}<span>1) Elegí qué vas a contar. 2) Escribí lo que hay en el local. 3) Revisá las diferencias y confirmá: el sistema ajusta el stock. Lo que dejes vacío no se toca.
      ${ult ? `<br><small>Último inventario: ${fMedia(ult.f)} (${esc(ult.cat || 'todo')}) · ${ult.dif.length} diferencias</small>` : ''}</span></div>
    <div class="herr mt"><select class="sel" onchange="EST_INV.cat=this.value;pintarInventario()" aria-label="Categoría"><option value="">Todo el stock</option>${cats.map(c => `<option ${c === e.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <button class="btn btn-linea btn-sm" onclick="imprimirPlanillaInventario()">${ico('imprimir')} Planilla para contar</button>
      <span class="muted chico" style="margin-left:auto">${Object.keys(e.conteo).filter(k => e.conteo[k] !== '').length} contados · <b class="${difs ? 'am' : ''}">${difs} diferencias</b>${difs ? ' · ' + pesos(valor) + ' a costo' : ''}</span></div>
    <div class="tabla-caja"><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Sistema</th><th class="derecha">Contado</th><th class="derecha">Diferencia</th></tr></thead>
      <tbody>${lista.map(p => { const c = e.conteo[p.id], s = stockDe(p), d = c === undefined || c === '' ? null : r2(Number(c) - s);
        return `<tr class="${d ? 'fila-dif' : ''}"><td><span class="p-nombre">${esc(p.nombre)}</span><span class="p-cod">${p.cod} · ${esc(p.cat)}</span></td><td class="derecha num">${cant(s)} ${unidadCorta(p)}</td>
          <td class="derecha"><input class="mini" type="number" step="${pasoDe(p)}" value="${c == null ? '' : c}" onchange="EST_INV.conteo['${p.id}']=this.value;pintarInventario()" aria-label="Contado"></td>
          <td class="derecha num fuerte ${d > 0 ? 'pos' : d < 0 ? 'neg' : 'muted'}">${d == null ? '—' : (d > 0 ? '+' : d < 0 ? '−' : '') + cant(Math.abs(d))}</td></tr>`; }).join('')}</tbody></table></div></div>
    <div class="fila mt" style="justify-content:flex-end"><button class="btn btn-linea" onclick="EST_INV.conteo={};pintarInventario()">Borrar conteo</button>
      <button class="btn btn-azul" ${difs ? '' : 'disabled'} onclick="confirmarInventario()">${ico('ok')} Confirmar ajuste (${difs})</button></div>`;
}
async function confirmarInventario(){
  const e = EST_INV, dif = [];
  D().productos.forEach(p => { const c = e.conteo[p.id]; if (c !== undefined && c !== '' && Number(c) !== stockDe(p)) dif.push({ p:p.id, sis:stockDe(p), real:Number(c) }); });
  if (!dif.length) return;
  if (!(await confirmar('Confirmar el inventario', `Se van a ajustar <b>${dif.length}</b> productos para que el stock quede igual a lo contado. Queda registrado como «Inventario».`, 'Ajustar stock'))) return;
  const ref = 'Inventario físico · ' + (e.cat || 'todo el stock');
  dif.forEach(x => { const d = r2(x.real - x.sis); if (d > 0) entrarStock(x.p, d, 'inventario', ref); else sacarStock(x.p, -d, 'inventario', ref); });
  D().inventarios.push({ id:Store.id('in'), f:hoy(), cat:e.cat, u:usuarioTxt(), dif });
  registrar(`Confirmó un inventario físico (${e.cat || 'todo el stock'}) con ${dif.length} diferencias`);
  EST_INV.conteo = {}; guardar(); avisar('Inventario confirmado: ' + dif.length + ' productos ajustados'); refrescar();
}

/* ---------- Actualización masiva de precios (solo dueños) ---------- */
function formPreciosMasivo(){
  if (!esDueno()) return;
  abrirModal({ titulo:'Actualizar precios', sub:'Por proveedor o por categoría, en porcentaje', ancho:'md',
    cuerpo:`<div class="form">
      ${campo('Aplicar a', sel('por', [['prov', 'Un proveedor'], ['cat', 'Una categoría']], 'prov', 'onchange="formPreciosOpc()"'))}
      <div id="pm-opc">${campo('Proveedor', sel('cual', D().proveedores.map(p => [p.id, p.nombre]), '', 'onchange="previaPrecios()"'))}</div>
      ${campo('Porcentaje', inp('pct', 8, 'number', 'oninput="previaPrecios()"'), { ayuda:'Negativo para bajar (ej.: −5)' })}
      ${campo('Redondear a', sel('red', [['1', 'Sin redondeo'], ['5', '$ 5'], ['10', '$ 10']], '10', 'onchange="previaPrecios()"'))}
      ${check('costo', false, 'Actualizar también el costo (el proveedor subió la lista)', 'onchange="previaPrecios()"')}
    </div><div id="pm-previa" class="mt"></div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="aplicarPrecios()">${ico('ok')} Aplicar</button>`,
    alAbrir: () => previaPrecios() });
}
function formPreciosOpc(){
  const por = $('[name=por]').value;
  $('#pm-opc').innerHTML = por === 'prov' ? campo('Proveedor', sel('cual', D().proveedores.map(p => [p.id, p.nombre]), '', 'onchange="previaPrecios()"')) : campo('Categoría', sel('cual', D().config.categorias, '', 'onchange="previaPrecios()"'));
  previaPrecios();
}
function calculoPrecios(){
  const o = leerForm($('#modal-cuerpo')), f = 1 + (Number(o.pct) || 0) / 100, red = Number(o.red) || 1;
  const lista = D().productos.filter(p => o.por === 'prov' ? p.prov === o.cual : p.cat === o.cual);
  return { o, lista:lista.map(p => ({ p, nuevo:Math.max(1, redondear(p.precio * f, red)), costo: o.costo ? Math.round(p.costo * f) : p.costo })) };
}
function previaPrecios(){
  const { o, lista } = calculoPrecios();
  $('#pm-previa').innerHTML = `<div class="tabla-caja"><div class="tabla-scroll" style="max-height:300px"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Precio actual</th><th class="derecha">Precio nuevo</th><th class="derecha">Margen nuevo</th></tr></thead>
    <tbody>${lista.map(x => `<tr><td>${esc(x.p.nombre)}</td><td class="derecha num muted">${pesos(x.p.precio)}</td><td class="derecha num fuerte">${pesos(x.nuevo)}</td><td class="derecha num t2">${pct((x.nuevo - x.costo) / x.nuevo * 100)}</td></tr>`).join('')}</tbody></table></div></div>
    <small class="muted">${lista.length} productos · los presupuestos ya hechos mantienen su precio.</small>`;
}
async function aplicarPrecios(){
  const { o, lista } = calculoPrecios();
  if (!lista.length || !Number(o.pct)){ error('Elegí a qué aplicar y el porcentaje'); return; }
  if (!(await confirmar('Actualizar ' + lista.length + ' precios', `Se van a cambiar los precios ${Number(o.pct) > 0 ? 'subiendo' : 'bajando'} un <b>${Math.abs(o.pct)} %</b>.`, 'Actualizar'))) return;
  lista.forEach(x => { x.p.precio = x.nuevo; x.p.costo = x.costo; });
  const nombre = o.por === 'prov' ? nombreProv(o.cual) : o.cual;
  registrar(`Actualizó ${lista.length} precios de ${nombre} un ${o.pct} %${o.costo ? ' (también el costo)' : ''}`);
  guardar(); cerrarModal(); avisar(lista.length + ' precios actualizados', 'porcentaje'); refrescar();
}


/* ===== js/13-entregas.js ===== */
/* =====================================================================
   ENTREGAS · ventas con envío, hoja de ruta y aviso por WhatsApp
   Lo vendido con envío queda RESERVADO; al marcar «Entregada» sale del stock.
   ===================================================================== */
const EST_ENT = { vista:'hoy' };
function chipEntrega(e){ const x = ESTADOS_ENTREGA[e]; return `<span class="chip ${x.c}">${x.t}</span>`; }
RENDER.entregas = function(){
  const h = hoy(), todas = ventasConEntrega();
  const grupos = {
    hoy:      todas.filter(v => v.ent.est !== 'entregada' && v.ent.f <= h),
    manana:   todas.filter(v => v.ent.est !== 'entregada' && v.ent.f === sumarDias(h, 1)),
    proximas: todas.filter(v => v.ent.est !== 'entregada'),
    entregadas: todas.filter(v => v.ent.est === 'entregada' && difDias(v.ent.f, h) <= 30)
  };
  const lista = grupos[EST_ENT.vista].sort((a, b) => a.ent.f.localeCompare(b.ent.f) || a.ent.zona.localeCompare(b.ent.zona));
  encabezado('Entregas', 'Pendiente → En camino → Entregada. Lo que falta entregar está reservado en el stock.',

function avisoWhatsApp(id){

async function marcarEnCamino(id){

function marcarEntregada(id){
  const v = venta(id);
  v.it.forEach(i => { const q = r2(i.c - i.e); if (q > 0){ sacarStock(i.p, q, 'entrega', 'Entrega · venta Nº ' + v.num); i.e = i.c; } });

function guardarEditarEntrega(id){

function guardarNuevaEntrega(){

const EST_COMP = { tab:'pedidos', prov:'' };
function verCompras(t){ EST_COMP.tab = t || 'pedidos'; if (seccionActual !== 'compras') ir('compras'); else RENDER.compras(); }

    `<button class="btn btn-linea" onclick="formPedido()">${ico('mas')} Nuevo pedido</button>` + (dueno ? `<button class="btn btn-azul" onclick="formCompra()">${ico('factura')} Registrar compra</button>` : ''));
  const tabs = [['pedidos', 'Pedidos', abiertos]]; if (dueno) tabs.push(['compras', 'Compras']); tabs.push(['proveedores', 'Proveedores', D().proveedores.length]);

function tabCompras(t){ EST_COMP.tab = t; RENDER.compras(); }

/* ---------- Pedidos ---------- */

      <div class="tabla-caja mt-s"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Pedido</th><th class="derecha">Recibido</th><th class="derecha">Falta</th></tr></thead>
      <tbody>${pd.it.map(i => { const p = producto(i.p); return `<tr><td>${esc(p.nombre)}<span class="p-cod">${p.cod}</span></td><td class="derecha num">${cant(i.c)} ${unidadCorta(p)}</td><td class="derecha num">${cant(i.r)}</td><td class="derecha num ${i.c - i.r > 0 ? 'am fuerte' : 'muted'}">${cant(Math.max(0, i.c - i.r))}</td></tr>`; }).join('')}</tbody></table></div>`,

function pedidoGuardadoWhatsApp(id){

/* ---------- Editor de renglones (pedido y compra) ---------- */
let _rengs = [], _rengCosto = false, _rengProv = '';
function optsProductos(prov){ return D().productos.slice().sort((a, b) => (b.prov === prov) - (a.prov === prov) || a.nombre.localeCompare(b.nombre)).map(p => `<option value="${esc(p.cod + ' · ' + p.nombre)}">`).join(''); }
function pintarRenglones(){
  const caja = $('#rengs'); if (!caja) return;
  caja.innerHTML = `<div class="reng reng-cab ${_rengCosto ? 'con-costo' : ''}"><span>Producto</span><span>Cantidad</span>${_rengCosto ? '<span>Costo unit.</span><span>Lote</span><span>Vence</span>' : ''}<span></span></div>` +
    _rengs.map((r, k) => { const p = prodDeTexto(r.t);
      return `<div class="reng ${_rengCosto ? 'con-costo' : ''}">
        <input list="dl-rp" value="${esc(r.t)}" placeholder="Nombre o código" onchange="_rengs[${k}].t=this.value;autoCosto(${k});pintarRenglones()" aria-label="Producto">
        <input type="number" inputmode="decimal" value="${r.c}" onchange="_rengs[${k}].c=this.value;totalRenglones()" aria-label="Cantidad">
        ${_rengCosto ? `<input type="number" inputmode="decimal" value="${r.co}" onchange="_rengs[${k}].co=this.value;totalRenglones()" aria-label="Costo">
          <input value="${esc(r.lote)}" ${p && p.vence ? '' : 'disabled placeholder="—"'} onchange="_rengs[${k}].lote=this.value" aria-label="Lote">
          <input type="date" value="${r.vence}" ${p && p.vence ? '' : 'disabled'} onchange="_rengs[${k}].vence=this.value" aria-label="Vence">` : ''}
        <button class="icon-btn" onclick="_rengs.splice(${k},1);pintarRenglones()" aria-label="Quitar">${ico('x')}</button></div>`; }).join('') +
    `<datalist id="dl-rp">${optsProductos(_rengProv)}</datalist>
     <div class="fila-fin mt-s"><button class="btn btn-linea btn-sm" onclick="_rengs.push({t:'',c:'',co:'',lote:'',vence:''});pintarRenglones()">${ico('mas')} Agregar producto</button><b class="num" id="reng-tot"></b></div>`;
  totalRenglones();
}
function autoCosto(k){ const p = prodDeTexto(_rengs[k].t); if (p && !_rengs[k].co) _rengs[k].co = p.costo; }
function totalRenglones(){ const el = $('#reng-tot'); if (el && _rengCosto) el.textContent = 'Total ' + pesos(_rengs.reduce((s, r) => s + (Number(r.c) || 0) * (Number(r.co) || 0), 0)); }
function leerRenglones(){
  const ok = [], mal = [];
  _rengs.forEach(r => { if (!r.t && !r.c) return; const p = prodDeTexto(r.t); if (!p || !(Number(r.c) > 0) || (_rengCosto && !(Number(r.co) > 0))) mal.push(r); else ok.push({ p, c:r2(Number(r.c)), co:Number(r.co) || p.costo, lote:r.lote, vence:r.vence }); });
  return { ok, mal };
}

/* ---------- Nuevo pedido ---------- */
function formPedido(prov){
  _rengProv = prov || D().proveedores[0].id; _rengCosto = false; _rengs = [{ t:'', c:'', co:'', lote:'', vence:'' }];
  abrirModal({ titulo:'Nuevo pedido', sub:'Cuando llegue la mercadería, se marca como recibido y entra al stock', ancho:'md',
    cuerpo:`<div class="form">${campo('Proveedor', sel('prov', D().proveedores.map(p => [p.id, p.nombre]), _rengProv, 'onchange="_rengProv=this.value;pintarRenglones()"'), { ancho:true })}</div>
      <div id="rengs" class="mt"></div><div class="form mt">${campo('Nota', inp('nota', '', 'text', 'placeholder="Ej.: entregar el martes"'), { ancho:true })}</div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="guardarPedido()">${ico('ok')} Guardar pedido</button>`,
    alAbrir: pintarRenglones });
}
function guardarPedido(){
  const { ok, mal } = leerRenglones(), o = leerForm($('#modal-cuerpo'));
  if (mal.length){ error('Revisá los productos: hay renglones incompletos'); return; }
  if (!ok.length){ error('Agregá al menos un producto'); return; }
  const pd = { id:Store.id('pd'), num:nuevoNumero('pedido'), prov:o.prov, f:hoy(), it:ok.map(x => ({ p:x.p.id, c:x.c, r:0 })), nota:o.nota, u:usuarioTxt() };
  D().pedidos.push(pd);
  registrar(`Creó el pedido Nº ${pd.num} a ${nombreProv(o.prov)}`);
  guardar(); cerrarModal(); avisar('Pedido Nº ' + pd.num + ' guardado'); fichaPedido(pd.id); refrescar();
}

/* ---------- Marcar recibido (total o parcial) ---------- */
function formRecibir(id){
  const pd = D().pedidos.find(x => x.id === id), pv = proveedor(pd.prov), dueno = esDueno();
  abrirModal({ titulo:'Recibir pedido Nº ' + pd.num, sub:esc(pv.nombre) + ' · cargá lo que llegó (puede ser parcial)', ancho:'lg',
    cuerpo:`<div class="tabla-caja"><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Falta</th><th class="derecha">Llegó</th>${dueno ? '<th class="derecha">Costo unit.</th>' : ''}<th>Lote</th><th>Vence</th></tr></thead>
      <tbody>${pd.it.filter(i => i.c - i.r > 0).map(i => { const p = producto(i.p);
        return `<tr><td>${esc(p.nombre)}<span class="p-cod">${p.cod}</span></td><td class="derecha num">${cant(i.c - i.r)} ${unidadCorta(p)}</td>
          <td class="derecha"><input class="mini" type="number" name="q_${i.p}" value="${r2(i.c - i.r)}" min="0" step="${pasoDe(p)}"></td>
          ${dueno ? `<td class="derecha"><input class="mini" type="number" name="co_${i.p}" value="${p.costo}"></td>` : ''}
          <td>${p.vence ? `<input class="mini izq" name="l_${i.p}" placeholder="Lote">` : '<span class="muted">—</span>'}</td>
          <td>${p.vence ? `<input class="mini fecha" type="date" name="v_${i.p}">` : '<span class="muted">—</span>'}</td></tr>`; }).join('')}</tbody></table></div></div>
      <div class="form mt">${campo('Nº de factura del proveedor', inp('fac', '', 'text', 'placeholder="Ej.: A 3190"'), { ayuda: dueno ? '' : 'Si no la tenés a mano, los dueños la completan después' })}
        ${dueno ? campo('Condición', sel('cond', [['credito', 'A crédito (' + (pv.plazo || 30) + ' días)'], ['contado', 'Al contado']], pv.plazo ? 'credito' : 'contado')) : ''}</div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="guardarRecepcion('${id}')">${ico('ok')} Confirmar: entra al stock</button>` });
}
function guardarRecepcion(id){
  const pd = D().pedidos.find(x => x.id === id), pv = proveedor(pd.prov), o = leerForm($('#modal-cuerpo')), dueno = esDueno();
  const it = [];
  for (const i of pd.it){
    const q = Number(o['q_' + i.p]) || 0; if (q <= 0) continue;
    const p = producto(i.p);
    if (p.vence && !o['v_' + i.p]){ error('Falta la fecha de vencimiento de ' + p.nombre); return; }
    it.push({ p:i.p, c:r2(q), co: dueno ? (Number(o['co_' + i.p]) || p.costo) : p.costo, lote: p.vence ? (o['l_' + i.p] || 'S/L') : '', vence: p.vence ? o['v_' + i.p] : '' });
  }
  if (!it.length){ error('Indicá qué llegó'); return; }
  const cond = dueno ? o.cond : 'credito';
  const cp = registrarCompra({ prov:pd.prov, fac:o.fac, f:hoy(), it, cond, venc: cond === 'credito' ? sumarDias(hoy(), pv.plazo || 30) : '', pedido:pd.id, revisar:!dueno }, 'Pedido Nº ' + pd.num);
  it.forEach(x => { const i = pd.it.find(y => y.p === x.p); i.r = r2(i.r + x.c); });
  if (cond === 'contado') nuevoDinero({ tipo:'pagoProv', prov:pd.prov, compra:cp.id, cat:'', monto:cp.tot, medio:'Efectivo', nota:'Compra al contado ' + (cp.fac || '') });
  const e = estadoPedido(pd);
  registrar(`Recibió ${e === 'recibido' ? 'completo' : 'en parte'} el pedido Nº ${pd.num} de ${pv.nombre} (${it.length} productos)`);
  guardar(); cerrarModal(); avisar('Mercadería ingresada al stock' + (e === 'parcial' ? ' · el pedido queda con saldo' : ''), 'stock'); refrescar();
}
// Entra al stock, actualiza el costo del producto y deja la compra registrada.
function registrarCompra(o, ref){
  const cp = Object.assign({ id:Store.id('cp'), u:usuarioTxt() }, o);
  cp.tot = Math.round(cp.it.reduce((s, i) => s + i.c * i.co, 0));
  cp.it = cp.it.map(i => ({ p:i.p.id || i.p, c:i.c, co:i.co, lote:i.lote || '', vence:i.vence || '' }));

  D().compras.push(cp);
  return cp;
}

function guardarCliente(id){

/* ---------- Asistencia: tocar un día cambia Trabajó → Falta → Licencia → (vacío) ---------- */
function pintarAsistencia(){
  const mes = EST_PERS.mes || inicioMes(hoy()), ini = aFecha(mes), dias = aFecha(finMes(mes)).getDate(), h = hoy();
  const offset = (ini.getDay() + 6) % 7, a = D().asist, tot = { T:0, F:0, L:0 };
  let celdas = '<div class="cal-cab">' + ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<span>${d}</span>`).join('') + '</div><div class="cal">' + '<span></span>'.repeat(offset);
  for (let d = 1; d <= dias; d++){
    const f = mes.slice(0, 8) + p2(d), v = a[f], fut = f > h;
    if (v) tot[v]++;
    celdas += `<button class="cal-d ${v ? 'as-' + v : ''} ${f === h ? 'hoy' : ''}" ${fut ? 'disabled' : ''} onclick="cambiarAsist('${f}')" aria-label="${fLarga(f)}: ${v ? ASISTENCIA[v].t : 'sin marcar'}"><b>${d}</b><small>${v ? ASISTENCIA[v].t : ''}</small></button>`;
  }
  celdas += '</div>';
  $('#pers-cuerpo').innerHTML = `<div class="card"><div class="card-cab"><div class="fila"><button class="icon-btn" onclick="moverMesAsist(-1)" aria-label="Mes anterior">${ico('izq')}</button>
      <div class="card-t" style="min-width:170px;text-align:center">${fMes(mes)}</div><button class="icon-btn" onclick="moverMesAsist(1)" aria-label="Mes siguiente" ${mes >= inicioMes(h) ? 'disabled' : ''}>${ico('der')}</button></div>
      <div class="fila">${Object.keys(ASISTENCIA).map(k => `<span class="chip ${ASISTENCIA[k].c}">${ASISTENCIA[k].t}: ${tot[k]}</span>`).join('')}</div></div>
    ${celdas}<p class="muted chico mt-s">Tocá un día para marcarlo: Trabajó → Falta → Licencia → sin marcar. Total del período: <b>${tot.T}</b> días trabajados.</p></div>`;
}
function moverMesAsist(n){ EST_PERS.mes = sumarMeses(EST_PERS.mes || inicioMes(hoy()), n); pintarAsistencia(); }
function cambiarAsist(f){
  const orden = ['T', 'F', 'L', undefined], a = D().asist, sig = orden[(orden.indexOf(a[f]) + 1) % orden.length];
  if (sig) a[f] = sig; else delete a[f];
  registrar(`Marcó asistencia del ${fCorta(f)}: ${sig ? ASISTENCIA[sig].t : 'sin marcar'}`);
  guardar(); pintarAsistencia();
}

      <details class="mt-s"><summary class="link">Ver el detalle de las ${r.cobradas.length} ventas</summary>
        <div class="tabla-caja mt-s"><div class="tabla-scroll" style="max-height:300px"><table class="tabla"><thead><tr><th>Nº</th><th>Fecha</th><th>Cliente</th><th class="derecha">Base</th><th class="derecha">Comisión</th></tr></thead>
        <tbody>${r.cobradas.map(v => { const c = comisionVenta(v); return `<tr class="clic" onclick="fichaVenta('${v.id}')"><td class="num">${v.num}</td><td>${fMedia(v.f)}</td><td>${esc(nombreCli(v.cli))}</td><td class="derecha num">${pesos(c.base)}</td><td class="derecha num fuerte">${pesos(c.com)}</td></tr>`; }).join('')}
        ${r.ajustes.map(a => `<tr><td></td><td>${fMedia(a.f)}</td><td class="t2">${esc(a.nota)}</td><td></td><td class="derecha num neg">${pesos(a.monto)}</td></tr>`).join('')}</tbody></table></div></div></details>

      <tbody>${liqs.map(l => `<tr><td>${fCorta(l.desde)} al ${fCorta(l.hasta)}</td><td class="t2">${l.ventas.length}</td><td class="derecha num">${pesos(l.base)}</td><td class="derecha num fuerte">${pesos(l.monto)}</td>

}
async function liquidarComisiones(){
  const h = hoy(), desde = EST_PERS.desde || inicioMes(h), hasta = EST_PERS.hasta || h, r = comisionAPagar(desde, hasta);
  if (!(await confirmar('Liquidar comisiones', `Del ${fCorta(desde)} al ${fCorta(hasta)}: <b>${r.cobradas.length} ventas</b>, comisión de <b>${pesos(r.total)}</b>. Queda «a pagar» hasta que la marques como pagada.`, 'Liquidar'))) return;
  const l = { id:Store.id('lq'), desde, hasta, ventas:r.cobradas.map(v => v.id), base:Math.round(r.base), monto:Math.round(r.total), f:h, pagada:false, fPago:'', u:usuarioTxt() };
  r.ajustes.forEach(a => a.liq = l.id);
  D().liquidaciones.push(l);
  registrar(`Liquidó comisiones del ${fCorta(desde)} al ${fCorta(hasta)}: ${pesos(l.monto)}`);
  guardar(); avisar('Comisiones liquidadas: ' + pesos(l.monto)); pintarComisiones(); pintarNav();
}
function pagarLiquidacion(id){
  const l = D().liquidaciones.find(x => x.id === id);
  abrirModal({ titulo:'Pagar comisión', sub:`${fCorta(l.desde)} al ${fCorta(l.hasta)} · ${pesos(l.monto)}`, ancho:'modal-sm',
    cuerpo:`<div class="form">${campo('Fecha de pago', inp('f', hoy(), 'date'))}${campo('Medio', sel('medio', ['Transferencia', 'Efectivo']))}</div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="confirmarPagoLiq('${id}')">Marcar pagada</button>` });
}
function confirmarPagoLiq(id){
  const l = D().liquidaciones.find(x => x.id === id), o = leerForm($('#modal-cuerpo'));
  l.pagada = true; l.fPago = o.f || hoy();
  nuevoDinero({ f:l.fPago, tipo:'gasto', cat:'Sueldos', concepto:'Comisión', monto:l.monto, medio:o.medio, nota:'Comisión ' + fCorta(l.desde) + ' al ' + fCorta(l.hasta) });
  registrar(`Pagó la comisión de ${pesos(l.monto)} (${fCorta(l.desde)} al ${fCorta(l.hasta)})`);

/* ---------- Caja diaria: apertura, ingresos y egresos, cierre con arqueo ---------- */
function pintarCaja(){

function pintarResultado(){

  const meses = Array.from({ length:7 }, (_, k) => mesClave(sumarMeses(hoy(), -k)));
  const retiros = D().dinero.filter(m => m.tipo === 'retiro' && mesClave(m.f) === mes).reduce((s, m) => s + m.monto, 0);
  const cats = Object.keys(r.porCat).sort((a, b) => r.porCat[b] - r.porCat[a]), maxCat = Math.max(1, ...cats.map(c => r.porCat[c]));
  $('#fin-cuerpo').innerHTML = `<div class="herr"><select class="sel" onchange="EST_FIN.mes=this.value;pintarResultado()" aria-label="Mes">${meses.map(m => `<option value="${m}" ${m === mes ? 'selected' : ''}>${fMes(m + '-01')}</option>`).join('')}</select>
      ${mes === mesClave(hoy()) ? '<span class="muted chico">Mes en curso (hasta hoy)</span>' : ''}</div>
    <div class="card resultado">
      <div class="res-fila"><span>Ventas <small>${r.n} ventas, sin anuladas ni devoluciones</small></span><b class="num">${pesos(r.vendido)}</b></div>
      <div class="res-fila menos"><span>− Costo de la mercadería vendida</span><b class="num">${pesos(r.cmv)}</b></div>
      <div class="res-fila sub"><span>= Ganancia bruta <small>${pct(r.vendido ? (r.vendido - r.cmv) / r.vendido * 100 : 0)} sobre ventas</small></span><b class="num">${pesos(r.vendido - r.cmv)}</b></div>
      <div class="res-fila menos"><span>− Gastos del mes</span><b class="num">${pesos(r.gastos)}</b></div>
      <div class="res-fila total ${r.ganancia < 0 ? 'neg' : ''}"><span>= Ganancia <small>margen ${pct(r.margen)}</small></span><b class="num">${pesos(r.ganancia)}</b></div>
      <p class="muted chico mt-s">Los retiros de los socios (${pesos(retiros)} este mes) no se restan: son reparto de la ganancia, no un gasto.</p></div>
    <div class="grid g-2 mt">
      <div class="card"><div class="card-cab"><div class="card-t">Ventas y gastos<small>Últimos 6 meses</small></div>
        <div class="leyenda"><span><i class="lv"></i>Ventas</span><span><i class="lg"></i>Gastos</span></div></div>${graficoSeisMeses(seis)}</div>
      <div class="card"><div class="card-cab"><div class="card-t">Gastos por categoría<small>${fMes(mes + '-01')}</small></div></div>
        ${cats.map(c => `<div class="barra-cat"><div class="fila-fin"><span>${c}</span><b class="num">${pesos(r.porCat[c])}</b></div><div class="avance"><span style="width:${r.porCat[c] / maxCat * 100}%"></span></div></div>`).join('') || vacio('Sin gastos este mes.')}</div>
    </div>`;
}
function graficoSeisMeses(datos){
  const W = 560, H = 250, pad = { l:52, r:10, t:14, b:34 }, max = Math.max(1, ...datos.map(d => Math.max(d.vendido, d.gastos)));
  const paso = Math.pow(10, Math.floor(Math.log10(max))), tope = Math.ceil(max / paso) * paso;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / tope), ancho = (W - pad.l - pad.r) / datos.length, bw = Math.min(26, ancho * .3);
  const lineas = [0, .25, .5, .75, 1].map(k => { const v = tope * k; return `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" class="gr-lin"/><text x="${pad.l - 8}" y="${y(v) + 4}" class="gr-eje" text-anchor="end">${v >= 1e6 ? (v / 1e6).toFixed(1).replace('.', ',') + ' M' : Math.round(v / 1000) + ' mil'}</text>`; }).join('');
  const barras = datos.map((d, i) => { const x = pad.l + ancho * i + ancho / 2, m = aFecha(d.mes + '-01');
    return `<g><title>${fMes(d.mes + '-01')}: ventas ${pesos(d.vendido)}, gastos ${pesos(d.gastos)}, ganancia ${pesos(d.ganancia)}</title>
      <rect x="${x - bw - 2}" y="${y(d.vendido)}" width="${bw}" height="${Math.max(0, y(0) - y(d.vendido))}" rx="3" class="gr-v"/>
      <rect x="${x + 2}" y="${y(d.gastos)}" width="${bw}" height="${Math.max(0, y(0) - y(d.gastos))}" rx="3" class="gr-g"/>
      <text x="${x}" y="${H - 12}" class="gr-eje" text-anchor="middle">${MESES_C[m.getMonth()]}</text></g>`; }).join('');
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas y gastos de los últimos 6 meses">${lineas}${barras}</svg>`;
}

      ${fila('diasVence', 'Aviso de vencimiento', 'Se avisa desde estos días antes (en rojo los de 30 o menos)', 'días')}
      ${fila('aperturaCaja', 'Apertura de caja sugerida', 'Efectivo con que arranca el día', '$')}</div></div>
    <div class="card mt"><div class="card-t">Negocio</div><p class="t2 mt-s"><b>${esc(NEGOCIO.nombre)}</b> · ${esc(NEGOCIO.rubro)} · ${esc(NEGOCIO.lema)}<br>
      <small class="muted">El nombre, el lema y el logo se configuran una sola vez (los ajusta Wydan).</small></p>
      <div class="fila mt"><button class="btn btn-peligro" onclick="reiniciarDemo()">${ico('volver')} Volver a los datos de ejemplo</button><small class="muted">Solo en esta demostración: borra lo que cargaste y vuelve a empezar.</small></div></div>`;
}
function guardarRegla(k, v, t){ D().config[k] = Number(v) || 0; registrar(`Cambió «${t}» a ${v}`); guardar(); avisar('Guardado'); pintarNav(); }

function pintarListas(){
  const c = D().config;
  const lista = (k, t, uso) => `<div class="card"><div class="card-t">${t}</div><div class="chips-lista mt-s">${c[k].map((x, i) => `<span class="chip sin-punto c-gris">${esc(x)}${uso(x) ? '' : ` <button class="chip-x" onclick="quitarDeLista('${k}',${i})" aria-label="Quitar">${ico('x')}</button>`}</span>`).join('')}</div>
    <div class="fila mt-s"><input class="sel" id="nuevo-${k}" placeholder="Agregar…" style="flex:1"><button class="btn btn-linea btn-sm" onclick="agregarALista('${k}')">${ico('mas')} Agregar</button></div>
    <small class="muted">Las que están en uso no se pueden quitar.</small></div>`;
  $('#conf-cuerpo').innerHTML = `<div class="grid g-2">${lista('categorias', 'Categorías de productos', x => D().productos.some(p => p.cat === x))}${lista('zonas', 'Zonas de entrega', x => D().clientes.some(cl => cl.zona === x) || D().ventas.some(v => v.ent && v.ent.zona === x))}</div>`;
}
function agregarALista(k){ const i = $('#nuevo-' + k), v = i.value.trim(); if (!v) return; if (D().config[k].includes(v)){ error('Ya existe'); return; } D().config[k].push(v); registrar(`Agregó «${v}» a ${k}`); guardar(); pintarListas(); }
function quitarDeLista(k, i){ const v = D().config[k][i]; D().config[k].splice(i, 1); registrar(`Quitó «${v}» de ${k}`); guardar(); pintarListas(); }

function pintarMensajes(){
  const m = D().config.mensajes;
  const bloque = (k, t, vars) => `<div class="card"><div class="card-t">${t}</div>${campo('', area('m_' + k, m[k], 'rows="4" onchange="guardarMensaje(\'' + k + '\',this.value)"'))}<small class="muted">Se reemplazan: ${vars}</small></div>`;
  $('#conf-cuerpo').innerHTML = `<div class="grid g-3">${bloque('entrega', 'Aviso de entrega', '{nombre}, {venta}, {direccion}')}${bloque('pedido', 'Pedido a proveedor', '{proveedor}, {lista}')}${bloque('presupuesto', 'Presupuesto', '{nombre}, {numero}, {lista}, {total}, {validez}')}</div>
    <div class="caja-info mt">${ico('wa')}<span>Los mensajes se abren en WhatsApp ya escritos: se revisan y se envían a mano.</span></div>`;
}
function guardarMensaje(k, v){ D().config.mensajes[k] = v; registrar('Cambió el mensaje de WhatsApp «' + k + '»'); guardar(); avisar('Mensaje guardado'); }

function pintarRegistro(){
  const q = sinTildes(EST_CONF.q), lista = D().log.filter(l => !q || sinTildes(l.a + ' ' + l.u).includes(q));
  const { filas, mas } = paginar(lista, EST_CONF, 'EST_CONF.ver+=100;pintarRegistro()');
  $('#conf-cuerpo').innerHTML = `<div class="herr">${buscador('r-q', EST_CONF.q, 'Buscar en el registro', 'filtroRegQ')}<span class="muted chico">Toda acción queda registrada con fecha, hora y usuario.</span></div>
    <div class="tabla-caja"><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Fecha</th><th>Hora</th><th>Usuario</th><th>Qué hizo</th></tr></thead>
      <tbody>${filas.map(l => `<tr><td>${fMedia(l.f)}</td><td class="num">${l.h}</td><td><span class="chip sin-punto ${/func/.test(l.u) ? 'c-naranja' : 'c-azul'}">${esc(l.u)}</span></td><td>${esc(l.a)}</td></tr>`).join('')}</tbody></table></div>${lista.length ? '' : vacio('Sin registros.')}${mas}</div>`;
}
let _tRQ;
function filtroRegQ(v){ EST_CONF.q = v; clearTimeout(_tRQ); _tRQ = setTimeout(() => { pintarRegistro(); const i = $('#r-q'); i.focus(); i.setSelectionRange(v.length, v.length); }, 200); }
async function reiniciarDemo(){
  if (!(await confirmar('Volver a los datos de ejemplo', 'Se borra todo lo que cargaste en esta demostración (solo en este navegador) y se vuelve a empezar.', 'Sí, reiniciar', true))) return;
  try { localStorage.removeItem(CLAVE_GUARDADO); } catch (e) {}
  location.reload();
}


/* ===== js/20-imprimir.js ===== */
/* =====================================================================
   IMPRESOS (A4, con el logo): presupuesto, hoja de ruta, cierre de caja
   y planilla para el inventario físico
   ===================================================================== */
function imprimir(titulo, sub, cuerpo){
  $('#impresion').innerHTML = `<div class="imp">
    <div class="imp-cab"><img src="${LOGO_YUNQUE}" alt=""><div class="imp-neg"><b>${esc(NEGOCIO.nombre)}</b><span>${esc(NEGOCIO.rubro)}</span>
      <span>RUT ${esc(NEGOCIO.rut)} · ${esc(NEGOCIO.direccion)} · Tel. ${esc(NEGOCIO.tel)}</span></div>
      <div class="imp-doc"><b>${titulo}</b><span>${sub}</span></div></div>
    ${cuerpo}
    <div class="imp-pie">${esc(NEGOCIO.lema)} · impreso el ${fCorta(hoy())} a las ${hora()} por ${esc(usuarioTxt())}</div></div>`;
  setTimeout(() => window.print(), 80);
}
function imprimirPresupuesto(id){
  const p = D().presupuestos.find(x => x.id === id), c = cliente(p.cli);
  imprimir('PRESUPUESTO Nº ' + p.num, fCorta(p.f) + ' · válido ' + p.val + ' días (hasta el ' + fCorta(sumarDias(p.f, p.val)) + ')',
    `<div class="imp-para"><small>Para</small><b>${esc(nombrePres(p))}</b>${c ? `<span>${c.tdoc} ${esc(c.doc)} · ${esc(c.dir)} · ${esc(c.tel)}</span>` : p.tel ? `<span>Tel. ${esc(p.tel)}</span>` : ''}</div>
    <table class="imp-t"><thead><tr><th>Código</th><th>Producto</th><th class="d">Cantidad</th><th class="d">Precio unit.</th><th class="d">Importe</th></tr></thead>
      <tbody>${p.it.map(i => { const pr = producto(i.p) || {}; return `<tr><td>${pr.cod || ''}</td><td>${esc(i.n)}</td><td class="d">${cant(i.c)} ${pr.unidad ? unidadCorta(pr) : ''}</td><td class="d">${pesos(i.pr)}</td><td class="d">${pesos(i.c * i.pr)}</td></tr>`; }).join('')}</tbody>
      <tfoot>${p.desc ? `<tr><td colspan="4" class="d">Subtotal</td><td class="d">${pesos(p.sub)}</td></tr><tr><td colspan="4" class="d">Descuento</td><td class="d">− ${pesos(p.desc)}</td></tr>` : ''}
        <tr class="imp-tot"><td colspan="4" class="d">TOTAL (IVA incluido)</td><td class="d">${pesos(p.tot)}</td></tr></tfoot></table>
    <p class="imp-nota">Precios en pesos uruguayos con IVA incluido. Sujeto a disponibilidad de stock al momento de la compra. El flete se cotiza aparte según la zona.</p>`);
}
function imprimirHojaRuta(dia){
  const lista = ventasConEntrega().filter(v => v.ent.est !== 'entregada' && v.ent.f <= dia).sort((a, b) => a.ent.zona.localeCompare(b.ent.zona) || a.ent.dir.localeCompare(b.ent.dir));
  if (!lista.length){ avisar('No hay entregas pendientes para imprimir', 'info'); return; }
  let zona = '', k = 0;
  imprimir('HOJA DE RUTA', fLarga(dia) + ' · ' + lista.length + ' entrega' + (lista.length > 1 ? 's' : ''),
    lista.map(v => { const c = cliente(v.cli), cab = v.ent.zona !== zona ? `<div class="imp-zona">${esc(zona = v.ent.zona)}</div>` : '';
      return cab + `<div class="imp-ent"><div class="imp-ent-n">${++k}</div><div class="imp-ent-c"><b>${esc(nombreCli(v.cli))}</b> · ${c ? esc(c.tel) : ''} · Venta Nº ${v.num}${v.ent.f < dia ? ' · <b>ATRASADA</b>' : ''}
        <div>${esc(v.ent.dir)}</div>${v.ent.nota ? `<div><i>Nota: ${esc(v.ent.nota)}</i></div>` : ''}
        <ul>${v.it.filter(i => i.c - i.e > 0).map(i => { const p = producto(i.p); return `<li>${cant(i.c - i.e)} ${unidadCorta(p)} · ${esc(i.n)}</li>`; }).join('')}</ul></div>
        <div class="imp-firma">Recibí conforme<br><br>Firma: ____________________</div></div>`; }).join(''));
}
function imprimirCierre(dia){
  const c = cajaDelDia(dia), ci = c.cierre;
  const filas = (arr, s) => arr.map(x => `<tr><td>${x.t} (${x.n})</td><td class="d">${s} ${pesos(x.monto)}</td></tr>`).join('');
  imprimir('CIERRE DE CAJA', fLarga(dia) + ' · cerró ' + esc(ci.u) + ' a las ' + ci.h,
    `<table class="imp-t imp-caja"><tbody><tr><td>Apertura</td><td class="d">${pesos(c.ap)}</td></tr>${filas(c.ing, '+')}${filas(c.egr, '−')}
      <tr class="imp-tot"><td>Debería haber</td><td class="d">${pesos(c.esperado)}</td></tr><tr><td>Se contó</td><td class="d">${pesos(ci.contado)}</td></tr>
      <tr class="imp-tot"><td>Diferencia</td><td class="d">${difTxt(ci.contado - ci.esperado)}</td></tr></tbody></table>
    ${Object.keys(c.otros).length ? `<table class="imp-t"><thead><tr><th>Otros medios (no pasan por caja)</th><th class="d">Monto</th></tr></thead><tbody>${Object.keys(c.otros).map(k => `<tr><td>${k}</td><td class="d">${pesos(c.otros[k])}</td></tr>`).join('')}</tbody></table>` : ''}
    ${ci.nota ? `<p class="imp-nota">Nota: ${esc(ci.nota)}</p>` : ''}<div class="imp-firmas"><span>Firma de quien cierra</span><span>Firma de control</span></div>`);
}
function imprimirPlanillaInventario(){
  const cat = EST_INV.cat, lista = D().productos.filter(p => !cat || p.cat === cat).sort((a, b) => a.nombre.localeCompare(b.nombre));
  imprimir('INVENTARIO FÍSICO', (cat || 'Todo el stock') + ' · ' + lista.length + ' productos',
    `<table class="imp-t"><thead><tr><th>Código</th><th>Producto</th><th>Unidad</th><th class="d">Contado</th></tr></thead>
      <tbody>${lista.map(p => `<tr><td>${p.cod}</td><td>${esc(p.nombre)}</td><td>${UNIDADES[p.unidad].t}</td><td class="d">__________</td></tr>`).join('')}</tbody></table>`);
}

function abrirApp(){
  const app = $('#app');
  app.classList.remove('hidden'); app.classList.add('entrando');
  setTimeout(() => app.classList.remove('entrando'), 700);
  pintarUsuario();
  ir(location.hash.slice(1) || 'inicio', true);
}
window.addEventListener('hashchange', () => { if (PERFIL && !$('#app').classList.contains('hidden')) ir(location.hash.slice(1), true); });
document.addEventListener('keydown', e => {
  if (e.key === 'F2' && PERFIL){ e.preventDefault(); nuevaVenta(); return; }   // atajo: F2 = nueva venta
  if (e.key !== 'Escape') return;
  if (!$('#dialogo').classList.contains('hidden')) $('#dlg-no').click();
  else if (modalAbierto()) cerrarModal();
  else { cerrarMenu(); cerrarCampana(); cerrarBusqueda(); }
});
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') cerrarModal(); });
window.addEventListener('afterprint', () => { $('#impresion').innerHTML = ''; });

Store.cargar();
armarLateral();
prepararBuscador();
// Desde la página comercial de Wydan (link con ?web=1) se entra directo al ingreso, sin la presentación.
// El link que se le manda a cada cliente (sin ?web=1) abre con la presentación de Wydan.
const DESDE_WEB = new URLSearchParams(location.search).has('web');
if (DESDE_WEB){ document.body.classList.add('modo-web'); mostrarBloqueo(); } else mostrarBienvenida();
